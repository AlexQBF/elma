/* ---------- цепочка переработки в карточке отгрузки ---------- */
function chainPanel(sh) {
  const st = shipmentStage(sh); if (st.code === 'direct') return '';
  const related = chainShipments(sh);
  const interLoc = st.code === 'stage1' ? locOfProcessor(sh.procId) : locById(sh.fromLocId);
  const interProc = processor(interLoc.ownerProc);
  const accs = METALS.map(m => findAccountByLoc(sh.assetId, interLoc.id, m)).filter(Boolean);
  const steps = st.code === 'stage1'
    ? [`<b>${esc(assetName(sh.assetId))}</b> → ${esc(productType(sh.productId).name)}`, `<b>${esc(interProc.name)}</b> (промежуточный): начисления на счёт УМС при этом переработчике`, `→ ${esc(productType(interProc.outputProductId).name)} отдельной отгрузкой на аффинажный завод (списание со счёта по лотам, А4)`]
    : [`${esc(assetName(sh.assetId))} → <b>${esc(interProc.name)}</b> (промежуточный): входящие отгрузки ниже`, `<b>эта отгрузка</b>: ${esc(productType(sh.productId).name)} списан со счёта при ${esc(interProc.name)} по лотам (А4)`, `→ <b>${esc(procName(sh.procId))}</b> (аффинаж): начисления на счёт при заводе`];
  return `<div class="panel"><div class="pt"><h2>Цепочка переработки</h2>${stage('mvp1', '5.1.5 · А4')}<span class="muted small">этапы связаны через счёт УМС промежуточного переработчика, а не ссылкой между отгрузками: металл на счёте обезличен</span></div>
    <div class="chain">${steps.map((x, i) => `<div class="chain-step ${(st.code === 'stage1' && i === 0) || (st.code === 'stage2' && i === 1) ? 'cur' : ''}"><span class="n">${i + 1}</span><span>${x}</span></div>`).join('<div class="chain-arrow">→</div>')}</div>
    <div class="grid2" style="margin-top:10px">
      <div><div class="muted small" style="margin-bottom:4px">Счёт ${esc(assetName(sh.assetId))} при ${esc(interProc.name)}</div>${accs.length ? accs.map(a => `<div>${refLink('account', a.id, accountName(a))}: <b>${fmtKg(a.balance)}</b></div>`).join('') : '<div class="muted">счёт ещё не открыт — откроется первым начислением</div>'}</div>
      <div><div class="muted small" style="margin-bottom:4px">${st.code === 'stage1' ? 'Отгрузки дальше, с ' + esc(interLoc.name) + ' на аффинаж' : 'Отгрузки, пришедшие на ' + esc(interProc.name) + ' по этому активу'}</div>${related.length ? related.map(x => `<div>${refLink('shipment', x.id)} · ${fmtD(x.sentFact)} · ${st.code === 'stage1' ? '→ ' + esc(procShort(x.procId)) : esc(productType(x.productId).name)} · ${badge(x.status)}</div>`).join('') : '<div class="muted">пока нет</div>'}</div>
    </div></div>`;
}

function lotsEmpty(sh) {
  if (sh.status === 'Отправлена') return `<div class="empty-state"><div><b>Лотов пока нет.</b> Добавьте их по спецификации кнопкой «+ Добавить лот» справа вверху блока. Без лотов отгрузка не может прибыть: по лотам считается плановый выход и идут начисления.</div><div class="muted small">Лот — строка спецификации: лигатурная масса, концентрация и масса каждого металла по нашей химии, файл спецификации. Обычно в отгрузке 1–3 лота.</div></div>`;
  return `<div class="muted" style="padding:10px 0">Лотов нет${sh.status === 'Отмена отправки' ? ' — отправка отменена' : ''}.</div>`;
}

/* ---------- имитация хода времени ---------- */
function formSetToday() {
  const due = d => DB.accruals.filter(a => a.status === 'Планируется' && a.planDate <= d && (a.type === 'prelim' || lot(a.lotId).finalConfirmed));
  const next = DB.accruals.filter(a => a.status === 'Планируется' && a.planDate > DB.today).map(a => a.planDate).sort()[0];
  openForm({ title: 'Сдвинуть учётную дату', tag: stage('proto'),
    note: `<div class="note info">В реальной системе «сегодня» идёт само, а планировщик (А31) в плановую дату исполняет начисления. В прототипе время стоит на ${fmtD(DB.today)}: сдвиньте дату вперёд — и всё, что наступило, исполнится автоматически, металл появится на счетах УМС. Назад вернуть можно только «Сбросить данные».</div>`,
    fields: [{ name: 'date', label: 'Новая учётная дата', type: 'date', value: DB.today, min: DB.today, required: true, hint: next ? 'ближайшее плановое начисление — ' + fmtD(next) : 'плановых начислений впереди нет' }],
    live: v => { const d = due(v.date || DB.today); return `<div class="lr"><span>Будет исполнено начислений</span><b>${d.length}</b></div>${METALS.map(m => { const dm = d.filter(a => a.metal === m); return dm.length ? `<div class="lr"><span>${m}</span><b>${fmtKg(sum(dm, a => a.planMass))}</b></div>` : ''; }).join('')}`; },
    submit: v => { if (v.date === DB.today) throw new Error('Выберите дату позже текущей учётной.'); const n = setToday(v.date); toast(`Учётная дата — ${fmtD(v.date)}. Планировщик исполнил начислений: ${n}`, 'ok', 6000); }, submitLabel: 'Сдвинуть' });
}

function formResetData() {
  openForm({ title: 'Сбросить данные', tag: stage('proto'),
    note: '<div class="note warn">Всё, что сделано в этом браузере, будет удалено.</div>',
    fields: [{ name: 'mode', label: 'Что загрузить', type: 'select', required: true, value: DB.mode === 'clean' ? 'clean' : 'demo', options: [{ value: 'demo', label: 'Демонабор — 20 отгрузок, 11 сделок, история за полгода' }, { value: 'clean', label: 'Чистая система — только справочники, договоры переработки и лимиты' }] }],
    live: v => v.mode === 'clean' ? '<div class="note info small">Останутся: активы, переработчики, перевозчики, локации, клиенты, пользователи, договоры переработки с условиями и правилами, лимиты (лицензии), календарь. Исчезнут: отгрузки, лоты, начисления, счета и транзакции, сделки, контракты, оплаты, перемещения, лента, задачи. Счета УМС откроются сами при первом начислении. Дальше идите по флоу: отгрузка → лоты → прибытие → химия завода → подтверждение → сделка → контракт → оплата.</div>' : '<div class="note info small">Исходный демонабор со всеми сценариями А–И, даты — относительно сегодняшнего дня.</div>',
    submit: v => { resetDemo(v.mode); setTimeout(() => go('#/overview'), 0); }, submitLabel: 'Сбросить' });
}

      METALS.forEach(m => { const mass = v[m + '_mass'] != null ? v[m + '_mass'] : (v[m + '_fineness'] != null && v.ligMass ? r1(v.ligMass * v[m + '_fineness'] / 100) : 0); if (!mass) return; const src = findAccountByLoc(v.assetId, v.fromLocId, m); const dst = findAccountByLoc(v.assetId, v.toLocId, m); out += `<div class="lr"><span>${m} ${fmtKg(mass)}: источник ${src ? esc(accountName(src)) : '<span class="neg">счёта нет — блок</span>'}</span><b class="${src && mass > src.balance ? 'neg' : ''}">${src ? `${fmtKg(src.balance)} → ${fmtKg(r1(src.balance - mass))}${mass > src.balance ? ' — нехватка, блок' : ''}` : ''}</b></div><div class="lr"><span>${m}: получатель ${dst ? esc(accountName(dst)) : 'счёт будет создан'}</span><b>${dst ? `${fmtKg(dst.balance)} → ${fmtKg(r1(dst.balance + mass))}` : `0 → ${fmtKg(mass)}`}</b></div>`; if (from && from.type === 'processor' && isRefinery(from.ownerProc)) { const lim = activeLimit(v.assetId, m); out += `<div class="lr"><span>${m}: лимит</span><b class="${!lim || limitRemaining(lim) - mass < 0 ? 'warn' : ''}">${lim ? `${esc(lim.name)}: остаток ${fmtKg(limitRemaining(lim))} → ${fmtKg(r1(limitRemaining(lim) - mass))}` : 'нет действующего лимита — предупреждение'}</b></div>`; } });
      return out || '<span class="muted">Укажите массу хотя бы одного металла</span>';
    },
    submit: v => { if (v.fromLocId === v.toLocId) throw new Error('«Откуда» и «Куда» совпадают.'); const { t, warnings } = createTransfer({ assetId: v.assetId, fromLocId: v.fromLocId, toLocId: v.toLocId, carrierId: v.carrierId, date: v.date, ligMass: v.ligMass, Au_fineness: v.Au_fineness, Au_mass: v.Au_mass, Ag_fineness: v.Ag_fineness, Ag_mass: v.Ag_mass, comment: v.comment }); toast('Перемещение ' + t.id + ' проведено на оба счёта', 'ok'); warnings.forEach(w => toast(w, 'warn', 9000)); setTimeout(() => go(H.transfer(t.id)), 0); }, submitLabel: 'Провести',
  });
}

function reconTable(rows, opts = {}) {
  return table({ id: opts.id || 'recon', compact: true, rows, defaultSort: { key: 'period', dir: 'desc' }, cols: [
    { key: 'id', label: 'Акт', val: r => r.id }, ...(opts.withAccount ? [{ key: 'acc', label: 'УМС', cls: 'nowrap', render: r => refLink('account', r.accountId, accountName(account(r.accountId))), sortVal: r => accountName(account(r.accountId)) }] : []),
    { key: 'period', label: 'Период', val: r => r.period.slice(5) + '.' + r.period.slice(0, 4), sortVal: r => r.period }, { key: 'ours', label: 'Наш остаток', num: true, render: r => fmtKg(r.ourBalance) }, { key: 'plant', label: 'Выписка завода', num: true, render: r => fmtKg(r.plantBalance) },
    { key: 'diff', label: 'Расхождение', num: true, sortVal: r => r.diff, render: r => `<b class="${Math.abs(r.diff) >= 0.05 ? 'neg' : ''}">${r.diff > 0 ? '+' : ''}${fmtKg(r.diff)}</b>` }, { key: 'status', label: 'Статус', render: r => badge(r.status) }, { key: 'date', label: 'Дата акта', cls: 'nowrap', val: r => fmtD(r.date) }, { key: 'doc', label: 'Документ', cls: 'nowrap small', val: r => r.doc }, { key: 'comment', label: 'Комментарий', cls: 'small', w: '26%', val: r => r.comment },
    { key: 'act', label: '', sortable: false, cls: 'nowrap', render: r => r.status === 'Расхождение' ? rowActs([{ label: 'Корректировка на разницу', act: 'reconCorrect', id: r.id, disabled: !isAdmin(), title: 'Администратор вводит корректировку по итогам сверки (3.3.8)' }]) : '' },
  ] });
}
function viewReconciliations() {
  const rows = (DB.reconciliations || []).filter(r => canSee(r.groupId));
  const st = UI.filters['recons'] || (UI.filters['recons'] = { q: '' });
  let rs = rows;
  if (st.q) rs = rs.filter(r => [r.id, accountName(account(r.accountId)), r.period].join(' ').toLowerCase().includes(st.q.toLowerCase()));
  if (st.status && st.status !== '*') rs = rs.filter(r => r.status === st.status);
  if (st.asset && st.asset !== '*') rs = rs.filter(r => r.assetId === st.asset);
  return `${pageHeader({ title: 'Акты сверки с переработчиками', titleExtra: stage('proto', 'ежемесячно'), subtitle: 'Сверка нашего остатка УМС на конец месяца с выпиской завода. Расхождение закрывается корректировкой администратора по итогам сверки (ТЗ 3.3.8); отдельного документа «акт сверки» в ТЗ нет — предложено для удобства.', actions: `<button class="btn primary" data-act="newRecon">+ Акт сверки</button>` })}
  <div class="toolbar"><input type="text" placeholder="Поиск…" value="${esc(st.q)}" data-search="recons"><select data-filter="recons|status"><option value="*">Статус: все</option>${['Сверено', 'Расхождение'].map(s => `<option ${st.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select><select data-filter="recons|asset"><option value="*">Актив: все</option>${DB.assets.map(a => `<option value="${a.id}" ${st.asset === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select><span class="cnt">${rs.length} из ${rows.length}</span></div>
  ${reconTable(rs, { withAccount: true, id: 'recons_t' })}`;
}
function formNewRecon(accId) {
  const accs = vis.accounts().filter(a => a.type === 'processor');
  const months = []; for (let i = 1; i <= 6; i++) { const d = new Date(DB.today + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() - i); months.push(d.toISOString().slice(0, 7)); }
  openForm({ title: 'Акт сверки с переработчиком за месяц', tag: stage('proto'), note: '<div class="note info">Наш остаток на конец месяца — сумма транзакций по дате транзакции (так же BI считает остаток на дату). Остаток по выписке завода вводится вручную. Расхождение закрывает корректировка администратора.</div>',
    fields: [{ name: 'accountId', label: 'Счёт УМС', type: 'select', options: accs.map(a => ({ value: a.id, label: accountName(a) })), value: accId || (accs[0] && accs[0].id), required: true }, { name: 'period', label: 'Месяц', type: 'select', options: months.map(m => ({ value: m, label: m.slice(5) + '.' + m.slice(0, 4) })), required: true }, { name: 'plantBalance', label: 'Остаток по выписке завода, г', type: 'number', step: '0.1', required: true }, { name: 'comment', label: 'Комментарий', type: 'textarea', full: true }],
    live: v => { const a = account(v.accountId); if (!a) return ''; const ours = balanceOnDate(a.id, lastDayOfMonth(v.period)); const diff = r1((v.plantBalance || 0) - ours); return `<div class="lr"><span>Наш остаток на ${fmtD(lastDayOfMonth(v.period))}</span><b>${fmtKg(ours)}</b></div><div class="lr"><span>Расхождение (завод − мы)</span><b class="${Math.abs(diff) >= 0.05 ? 'neg' : 'pos'}">${fmtKg(diff)} → ${Math.abs(diff) < 0.05 ? 'Сверено' : 'Расхождение'}</b></div>`; },
    submit: v => { const r = createReconciliation(account(v.accountId), v.period, v.plantBalance, v.comment); toast('Акт сверки ' + r.id + ' создан: ' + r.status, r.status === 'Сверено' ? 'ok' : 'warn'); }, submitLabel: 'Создать акт' });
}

const refRowBtns = (coll, id, delOk = true) => rowActs([{ label: 'Изменить', act: 'refEdit', coll, id }, delOk ? { label: 'Удалить', act: 'refDel', coll, id, danger: true, disabled: !isAdmin(), title: isAdmin() ? '' : 'Удаляет администратор' } : null]);

/* ============================================================
   Карточка окном поверх списка + правая панель «Статус / Задачи / Лента»

'use strict';

const CARD_PAGES = { shipments: 'shipment', lots: 'lot', accruals: 'accrual', 'proc-contracts': 'procContract', deals: 'deal', contracts: 'contract', payments: 'payment', accounts: 'account', transfers: 'transfer', limits: 'limit', licenses: 'license' };
const isCardRoute = h => { const r = parseRouteOf(h); return !!(CARD_PAGES[r.page] && r.id); };
function parseRouteOf(h) { let s = h || ''; try { s = decodeURIComponent(s.replace(/^#\/?/, '')); } catch (e) { s = s.replace(/^#\/?/, ''); } const [page, ...rest] = s.split('/'); return { page: page || 'overview', id: rest.join('/') || null, path: s }; }
const STATUS_GETTERS = {
  shipment: id => shipment(id), lot: id => lot(id), accrual: id => accrual(id), procContract: id => procContract(id), deal: id => deal(id), contract: id => salesContract(id), payment: id => payment(id), account: id => account(id), transfer: id => transfer(id), limit: id => limit(id), license: id => DB.licenseApps.find(a => a.id === id),
};
const STATUS_SETS = {
  shipment: ['Отправлена', 'Прибыла', 'Завершена переработка', 'Отмена отправки'], lot: ['Отправлена', 'Прибыла', 'Завершена переработка', 'Отмена отправки'], accrual: ['Планируется', 'Исполнено', 'Отменено'],
  deal: ['Предварительная', 'Заключена', 'Исполняется', 'Завершена', 'Отменена'], contract: ['Предварительная', 'Заключена', 'Исполняется', 'Завершена', 'Отменена'], payment: ['Планируется', 'Поступила', 'Отменена'],
  transfer: ['Проведено', 'Отменено'], limit: ['Действует', 'Архив'], procContract: ['Проект', 'Действует', 'Завершён'],
};
const STATUS_ACT = { shipment: 'statusShipment', lot: 'statusLot', accrual: 'statusAccrual', deal: 'statusDeal', contract: 'statusContract', payment: 'statusPayment', transfer: 'statusTransfer' };
const KIND_LABEL = { shipment: 'отгрузка', lot: 'лот', accrual: 'начисление', procContract: 'договор', deal: 'сделка', contract: 'контракт', payment: 'оплата', account: 'счёт', transfer: 'перемещение', limit: 'лимит', license: 'заявка' };

/* ---------- события детей для ленты ---------- */
function feedEvents(kind, id) {
  const pairs = [['' + kind, id]];
  if (kind === 'shipment') { DB.lots.filter(l => l.shipmentId === id).forEach(l => pairs.push(['lot', l.id])); DB.accruals.filter(a => a.shipmentId === id).forEach(a => pairs.push(['accrual', a.id])); }
  if (kind === 'lot') DB.accruals.filter(a => a.lotId === id).forEach(a => pairs.push(['accrual', a.id]));
  if (kind === 'deal') { DB.salesContracts.filter(c => c.dealId === id).forEach(c => pairs.push(['contract', c.id])); DB.payments.filter(p => p.dealId === id).forEach(p => pairs.push(['payment', p.id])); }
  if (kind === 'contract') DB.payments.filter(p => p.contractId === id).forEach(p => pairs.push(['payment', p.id]));
  if (kind === 'account') pairs.push(['system', id]);
  const ev = DB.events.filter(e => pairs.some(([k, i]) => e.kind === k && e.id === i)).map(e => ({ ts: e.ts, date: e.date, user: e.user, text: e.text, system: true, obj: e.kind === kind && e.id === id ? null : e.id }));
  const cm = (DB.comments || []).filter(c => c.kind === kind && c.objId === id).map(c => ({ ts: c.ts, date: c.ts.slice(0, 10), user: c.user, text: c.text, system: false }));
  return ev.concat(cm).sort((a, b) => cmpDate(b.ts, a.ts));
}
function addComment(kind, id, text) { DB.comments = DB.comments || []; DB.comments.push({ id: nextNo('КМ', 4), kind, objId: id, user: DB.currentUserId, ts: DB.today + 'T' + new Date().toTimeString().slice(0, 5), text }); }

/* ---------- задачи: вычисляемые из состояния + ручные ---------- */
function autoTasks(kind, rec) {
  const t = [], today = DB.today;
  const add = (text, act, due, urgent) => t.push({ text, act, due, urgent: urgent || (due && due < today) });
  switch (kind) {
    case 'shipment':
      if (rec.status === 'Отправлена' && !DB.lots.some(l => l.shipmentId === rec.id)) add('Добавить лоты по спецификациям', 'addLot');
      if (rec.status === 'Отправлена' && rec.arrPlan && rec.arrPlan <= today) add('Отметить прибытие и приёмку', 'arrive', rec.arrPlan);
      break;
    case 'lot':
      if (rec.status === 'Прибыла' && !rec.finalConfirmed) {
        if (rec.Au_conc_proc == null) add('Внести показатели переработчика по документам приёмки', 'procChem');
        else if (rec.arbitrationRequired && rec.Au_conc_arb == null) add('Расхождение выше порога: решить вопрос об арбитраже, внести показатели', 'arbChem');
        else { const fin = DB.accruals.filter(a => a.lotId === rec.id && a.type === 'final' && a.status === 'Планируется').sort((a, b) => cmpDate(a.planDate, b.planDate))[0]; add('Подтвердить итоговые показатели (выбрать источник)', 'confirmFinal', fin ? fin.planDate : null); }
      }
      break;
    case 'accrual':
      if (rec.status === 'Планируется' && rec.planDate <= today) { if (rec.type === 'final' && !lot(rec.lotId).finalConfirmed) add('Ждёт подтверждения итоговых показателей лота ' + rec.lotId, null, rec.planDate); else add('Исполнить начисление (в MVP-1 — вручную)', 'execAccrual', rec.planDate); }
      break;
    case 'deal':
      if (rec.status === 'Предварительная') { if (!dealContracts(rec.id).length) add('Добавить контракты по активам-продавцам', 'addContract'); else add('Заключить сделку: зафиксировать котировки', 'concludeDeal'); }
      break;
    case 'contract':
      if (['Заключена', 'Исполняется'].includes(rec.status) && !rec.transferDate) add('Передать металл спецперевозчику', 'transferContract');
      if (rec.logistics === 'our' && rec.transferDate && !rec.receivedDate) add('Отметить получение покупателем', 'receiveContract');
      DB.payments.filter(p => p.contractId === rec.id && p.status === 'Планируется' && p.planDate <= today).forEach(p => add(`Отметить поступление оплаты ${p.id} (${fmtUsd(p.planUSD)})`, null, p.planDate, true));
      if (rec.transferDate && !rec.giisReported && rec.status !== 'Отменена') add('Подать отчёт о переходе собственности в ГИИС ДМДК (5 к.д.)', 'giisReport', addDays(rec.transferDate, 5));
      break;
    case 'payment':
      if (rec.status === 'Планируется' && rec.planDate <= today) add('Отметить поступление оплаты', 'receivePayment', rec.planDate);
      if (rec.status === 'Поступила' && !rec.rfmReported) add('Подать отчёт в Росфинмониторинг (3 р.д.)', 'rfmReport', addBusinessDays(rec.factDate, 3));
      break;
    case 'limit':
      if (rec.status === 'Действует' && limitPct(rec) >= 80) add(`Лимит использован на ${limitPct(rec)} %: получить корректировку или новую лицензию`, 'addAdj', null, limitRemaining(rec) < 0);
      break;
    case 'procContract':
      if (rec.status === 'Проект') { const errs = checkContractRules(rec.id); add(errs.length ? 'Дополнить условия и правила начисления' : 'Перевести договор в «Действует»', errs.length ? 'addCondition' : 'activateProcContract'); }
      if (rec.status === 'Действует' && daysBetween(today, rec.dateTo) <= 45) add(`Договор заканчивается ${fmtD(rec.dateTo)}: подготовить новый`, null, rec.dateTo);
      break;
    case 'account':
      if (rec.balance < 0) add('Отрицательный остаток: сверить документы и начисления', null, null, true);
      (DB.reconciliations || []).filter(x => x.accountId === rec.id && x.status === 'Расхождение').forEach(x => add(`Расхождение с заводом по акту ${x.id} за ${x.period}: ${fmtKg(x.diff)}`, 'newRecon', null, true));
      break;
  }
  return t;
}
function manualTasks(kind, id) { return (DB.tasks || []).filter(x => x.kind === kind && x.objId === id); }
function addTask(kind, id, data) { DB.tasks = DB.tasks || []; const t = { id: nextNo('ЗД', 4), kind, objId: id, done: false, created: DB.today, author: DB.currentUserId, ...data }; DB.tasks.push(t); return t; }

/* ---------- панель ---------- */
function statusSince(kind, id) {
  const ev = eventsFor(kind, id).slice().reverse().find(e => /стату|заключ|отмен|исполнен|прибыл|проведен|поступил|создан|действует|архив|заверш/i.test(e.text));
  return ev ? ev.date : null;
}
function sidePanel(kind, rec) {
  const id = rec.id;
  const hasStatus = !!STATUS_SETS[kind] && rec.status;
  let statusHtml = '';
  if (hasStatus) {
    const since = statusSince(kind, id);
    const canSet = isAdmin() && STATUS_ACT[kind];
    statusHtml = `<div class="sp-block"><div class="sp-h">Статус</div>${canSet ? `<select class="sp-status" data-status-kind="${kind}">${STATUS_SETS[kind].map(s => `<option ${s === rec.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<div class="sp-status-txt">${badge(rec.status)}</div>`}<div class="sp-sub">${since ? 'с ' + fmtD(since) : ''}${canSet ? ' · администратор меняет как поле (MVP-1)' : ' · меняется сценариями (MVP-2)'}</div></div>`;
  } else if (kind === 'license') statusHtml = `<div class="sp-block"><div class="sp-h">Этап</div><div class="sp-status-txt">${badge(rec.status)}</div></div>`;
  const auto = autoTasks(kind, rec), manual = manualTasks(kind, id);
  const showTasks = !['transfer', 'license'].includes(kind);
  const tasksHtml = showTasks ? `<div class="sp-block"><div class="sp-h">Задачи <span class="muted small">${auto.length + manual.filter(t => !t.done).length}</span><a class="ref sp-add" data-act="addTask">+ Задача</a></div>
    ${auto.map(t => `<div class="sp-task auto"><span class="sp-dot ${t.urgent ? 'red' : t.due ? 'amber' : 'blue'}"></span><div>${t.act ? `<a class="ref" data-act="${t.act}">${esc(t.text)}</a>` : esc(t.text)}<div class="sp-sub">по состоянию документа ${stage('proto')}${t.due ? ' · срок ' + fmtD(t.due) : ''}</div></div></div>`).join('')}
    ${manual.map(t => `<div class="sp-task ${t.done ? 'done' : ''}"><input type="checkbox" data-act="toggleTask" data-id="${t.id}" ${t.done ? 'checked' : ''}><div>${esc(t.text)}<div class="sp-sub">${esc(user(t.assignee) ? user(t.assignee).name : '—')}${t.due ? ' · до ' + fmtD(t.due) : ''} · <a class="ref" data-act="delTask" data-id="${t.id}">удалить</a></div></div></div>`).join('')}
    ${!auto.length && !manual.length ? '<div class="sp-sub">Нет текущих задач</div>' : ''}</div>` : '';
  const feed = feedEvents(kind, id).slice(0, 40);
  const feedHtml = `<div class="sp-block"><div class="sp-h">Лента</div><div class="sp-compose"><textarea id="cmtText" placeholder="Написать сообщение"></textarea><button class="btn sm" data-act="addComment">Отправить</button></div>
    ${feed.map(f => `<div class="sp-msg"><span class="avatar ${f.system ? 'sys' : ''}">${f.system ? 'С' : esc(user(f.user).name.split(' ').map(s => s[0]).join(''))}</span><div><div class="sp-who">${f.system ? 'Система' : esc(user(f.user).name)} <span class="muted">${fmtD(f.date)}</span>${f.obj ? ` <span class="muted">· ${esc(f.obj)}</span>` : ''}</div><div class="sp-txt">${esc(f.text)}</div></div></div>`).join('') || '<div class="sp-sub">Событий нет</div>'}</div>`;
  return statusHtml + tasksHtml + feedHtml;
}

/* ---------- отрисовка карточки окном ---------- */
function renderCardOverlay(r, html) {
  let ov = document.getElementById('cardOverlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'cardOverlay'; ov.className = 'card-overlay'; document.body.appendChild(ov); ov.addEventListener('click', e => { if (e.target === ov) closeCard(); }); }
  const kind = CARD_PAGES[r.page]; const rec = STATUS_GETTERS[kind] ? STATUS_GETTERS[kind](r.id) : null;
  const accessible = rec && !/class="note err"/.test(html.slice(0, 200));
  const icons = `<div class="card-icons elma-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>`;
  ov.innerHTML = `<div class="card-win"><a class="card-x" data-close-card title="Закрыть (Esc)">✕</a>${icons}<div class="card-main">${html}</div><div class="card-side">${accessible ? sidePanel(kind, rec) : ''}</div><div class="card-foot"></div></div>`;
  const acts = ov.querySelector('.card-main .ph .actions'); const foot = ov.querySelector('.card-foot');

/* ============================================================

/* Листы: ключ DB → имя листа (русское) */
const SHEET_NAMES = {
  groups: 'Группы активов', assets: 'Активы', processors: 'Переработчики', carriers: 'Перевозчики', locations: 'Локации', metals: 'Металлы', productTypes: 'Типы продукции', clients: 'Клиенты', users: 'Пользователи',
  deliveryTerms: 'Сроки доставки', arbThresholds: 'Пороги арбитража', calendar: 'Календарь',
  procContracts: 'Договоры переработки', conditions: 'Условия переработки', rules: 'Правила начислений',
  shipments: 'Отгрузки', lots: 'Лоты', accruals: 'Начисления',
  deals: 'Сделки', salesContracts: 'Контракты продажи', payments: 'Оплаты',
  accounts: 'Счета УМС', transactions: 'Транзакции УМС', transfers: 'Перемещения', limits: 'Лимиты', limitAdjustments: 'Корректировки лимитов',
  licenseApps: 'Лицензии', planRows: 'Планирование', items: 'Товарные позиции', events: 'События', tasks: 'Задачи', comments: 'Комментарии', reconciliations: 'Акты сверки',
};
const SHEET_KEYS = Object.fromEntries(Object.entries(SHEET_NAMES).map(([k, v]) => [v, k]));
const META_SHEET = 'meta', SCHEMA_SHEET = '_schema';

function loadRemoteCfg() { if (!REMOTE_ENABLED) { REMOTE.url = ''; REMOTE.state = 'off'; return; } try { const o = JSON.parse(localStorage.getItem(REMOTE_KEY) || 'null'); if (o) { REMOTE.url = o.url || ''; REMOTE.auto = o.auto !== false; REMOTE.lastSync = o.lastSync || null; REMOTE.snap = o.snap || {}; } } catch (e) { } REMOTE.state = REMOTE.url ? 'idle' : 'off'; }
function saveRemoteCfg() { try { localStorage.setItem(REMOTE_KEY, JSON.stringify({ url: REMOTE.url, auto: REMOTE.auto, lastSync: REMOTE.lastSync, snap: REMOTE.snap })); } catch (e) { } }

/* ---------- сериализация: объекты → строки листа ---------- */
function flattenRow(obj, prefix, out) {
  Object.keys(obj).forEach(k => {
    const v = obj[k], key = prefix ? prefix + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) flattenRow(v, key, out);
    else if (Array.isArray(v)) out[key + '_json'] = JSON.stringify(v);
    else out[key] = v;
  });
  return out;
}
function typeOf(v) { return typeof v === 'number' ? 'n' : typeof v === 'boolean' ? 'b' : 's'; }
function tableOfArray(arr) {
  const rowsF = arr.map(o => flattenRow(o, '', {}));
  const headers = []; rowsF.forEach(r => Object.keys(r).forEach(k => { if (!headers.includes(k)) headers.push(k); }));
  const types = {}; headers.forEach(h => { const nz = rowsF.map(r => r[h]).find(v => v != null && v !== ''); types[h] = h.endsWith('_json') ? 'j' : nz == null ? 's' : typeOf(nz); });
  const rows = rowsF.map(r => headers.map(h => { const v = r[h]; return v == null ? '' : v; }));
  return { headers, rows, types };
}
function toTables() {
  const tables = {};
  Object.keys(SHEET_NAMES).forEach(k => { tables[SHEET_NAMES[k]] = tableOfArray(DB[k] || []); });
  const meta = [['today', DB.today], ['nowStamp', DB.nowStamp], ['currentUserId', DB.currentUserId], ['params', JSON.stringify(DB.params || {})], ['seq', JSON.stringify(SEQ || {})]];
  tables[META_SHEET] = { headers: ['key', 'value'], rows: meta, types: { key: 's', value: 's' } };
  const schema = []; Object.keys(tables).forEach(name => { if (name === META_SHEET) return; const t = tables[name]; t.headers.forEach(h => schema.push([name, h, t.types[h]])); delete t.types; });
  delete tables[META_SHEET].types;
  tables[SCHEMA_SHEET] = { headers: ['sheet', 'column', 'type'], rows: schema };
  return tables;
}
/* ---------- десериализация: строки листа → объекты ---------- */
function coerce(v, type, colHasNumber) {
  if (v === '' || v == null) return null;
  if (type === 'j') { if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { return v.split(',').map(s => s.trim()).filter(Boolean); } }
  if (type === 'b' || v === 'TRUE' || v === 'FALSE' || v === true || v === false) return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';
  if (type === 'n' || (type == null && colHasNumber)) { if (typeof v === 'number') return v; const n = Number(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? v : n; }
  if (typeof v === 'number' && type === 's') return String(v);
  return v;
}
function setDeep(obj, path, v) { const ks = path.split('.'); let o = obj; ks.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = v; }
function fromTables(tables) {
  const schema = {}; const st = tables[SCHEMA_SHEET]; if (st) st.rows.forEach(r => { schema[r[0] + '|' + r[1]] = r[2]; });
  const db = emptyDB(); const seq = {};
  Object.keys(tables).forEach(name => {
    const key = SHEET_KEYS[name]; if (!key) return; const t = tables[name]; if (!t || !t.headers) return;
    const hasNum = t.headers.map((h, i) => t.rows.some(r => typeof r[i] === 'number'));
    db[key] = t.rows.filter(r => r.some(c => c !== '' && c != null)).map(r => { const o = {}; t.headers.forEach((h, i) => { if (!h) return; const type = schema[name + '|' + h] || (h.endsWith('_json') ? 'j' : null); const v = coerce(r[i], type, hasNum[i]); if (h.endsWith('_json')) setDeep(o, h.slice(0, -5), v == null ? [] : v); else setDeep(o, h, v); }); return o; });
  });
  const meta = tables[META_SHEET]; if (meta) meta.rows.forEach(([k, v]) => { if (k === 'today' && v) db.today = String(v).slice(0, 10); else if (k === 'nowStamp' && v) db.nowStamp = String(v); else if (k === 'currentUserId' && v) db.currentUserId = String(v); else if (k === 'params' && v) { try { db.params = JSON.parse(v); } catch (e) { } } else if (k === 'seq' && v) { try { Object.assign(seq, JSON.parse(v)); } catch (e) { } } });
  if (!db.users.find(u => u.id === db.currentUserId)) db.currentUserId = db.users[0] ? db.users[0].id : 'U1';
  return { db, seq };
}

/* ---------- транспорт ---------- */
async function remoteCall(action, payload) {
  if (!REMOTE.url) throw new Error('Не задан адрес веб-приложения Apps Script');
  const url = REMOTE.url.trim();
  let resp;
  if (payload) resp = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
  else resp = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=' + action + '&_=' + Date.now(), { method: 'GET', redirect: 'follow' });
  const txt = await resp.text();
  let o; try { o = JSON.parse(txt); } catch (e) { throw new Error('Ответ не JSON (' + resp.status + '). Проверьте, что веб-приложение развёрнуто с доступом «Все» и адрес заканчивается на /exec. Начало ответа: ' + txt.slice(0, 120).replace(/\s+/g, ' ')); }
  if (!o.ok) throw new Error(o.error || 'Ошибка на стороне таблицы');
  return o;
}
function setRemoteState(state, error) { REMOTE.state = state; REMOTE.error = error || null; renderSyncBadge(); }
function renderSyncBadge() {
  const el = document.getElementById('syncBadge'); if (!el) return; if (!REMOTE_ENABLED) { el.remove(); return; }
  const map = { off: ['', 'локально'], idle: ['blue', 'таблицы'], busy: ['amber', 'синхронизация…'], ok: ['green', 'таблицы · ' + (REMOTE.lastSync ? fmtT(REMOTE.lastSync) : 'ок')], err: ['red', 'ошибка связи'], dirty: ['amber', 'есть несохранённое'] };
  const [cls, text] = map[REMOTE.state] || map.off;
  el.className = 'sync ' + cls; el.innerHTML = `<span class="dot"></span>${esc(text)}`; el.title = REMOTE.error || (REMOTE.url ? 'Источник данных: Google Таблицы' : 'Данные хранятся в этом браузере. Нажмите, чтобы подключить Google Таблицы');
}
function fmtT(iso) { try { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); } catch (e) { return ''; } }

async function remotePing() { const r = await remoteCall('ping'); return r; }
async function remoteLoad({ silent } = {}) {
  setRemoteState('busy'); REMOTE.busy = true;
  try {
    const r = await remoteCall('load');
    const names = Object.keys(r.tables || {}).filter(n => SHEET_KEYS[n]);
    if (!names.length) throw new Error('В таблице нет листов прототипа. Сначала выгрузите данные («Выгрузить всё в таблицы»).');
    const { db, seq } = fromTables(r.tables);
    DB = db; SEQ = seq; DB.tasks = DB.tasks || []; DB.comments = DB.comments || []; DB.reconciliations = DB.reconciliations || [];
    try { repostAll(); } catch (e) { console.warn('repostAll', e); }
    try { recalcAllAccounts(); } catch (e) { }
    REMOTE.snap = {}; const t = toTables(); Object.keys(t).forEach(n => { REMOTE.snap[n] = JSON.stringify(t[n]); });
    REMOTE.lastSync = new Date().toISOString(); saveRemoteCfg();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ db: DB, seq: SEQ, saved: REMOTE.lastSync })); } catch (e) { }
    setRemoteState('ok'); if (!silent) toast('Данные загружены из Google Таблиц: ' + names.length + ' листов', 'ok');
    return true;
  } catch (e) { setRemoteState('err', e.message); if (!silent) toast('Не удалось загрузить из таблиц: ' + e.message, 'err', 9000); return false; }
  finally { REMOTE.busy = false; }
}
async function remotePush({ all } = {}) {
  if (!REMOTE.url) return false;
  if (REMOTE.busy) { REMOTE.pending = true; return false; }
  const t = toTables(); const changed = {};
  Object.keys(t).forEach(n => { const s = JSON.stringify(t[n]); if (all || REMOTE.snap[n] !== s) changed[n] = t[n]; });
  if (!Object.keys(changed).length) { setRemoteState('ok'); return true; }
  setRemoteState('busy'); REMOTE.busy = true;
  try {
    await remoteCall('save', { tables: changed, all: !!all });
    Object.keys(changed).forEach(n => { REMOTE.snap[n] = JSON.stringify(changed[n]); });
    REMOTE.lastSync = new Date().toISOString(); saveRemoteCfg(); setRemoteState('ok');
    return true;
  } catch (e) { setRemoteState('err', e.message); toast('Не удалось записать в таблицы: ' + e.message, 'err', 9000); return false; }
  finally { REMOTE.busy = false; if (REMOTE.pending) { REMOTE.pending = false; schedulePush(); } }
}
function schedulePush() {
  if (!REMOTE_ENABLED || !REMOTE.url || !REMOTE.auto) return;
  setRemoteState('dirty'); clearTimeout(REMOTE.timer);
  REMOTE.timer = setTimeout(() => remotePush(), 1200);
}

const APPS_SCRIPT_CODE = `/* Прототип «коммерческий блок» — хранилище в Google Таблицах.
   Вставьте в Расширения → Apps Script, разверните как веб-приложение
   (выполнять от моего имени, доступ: Все) и укажите URL /exec в прототипе. */
var META = 'meta', SCHEMA = '_schema';

function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) || 'load';
  try {
    if (action === 'ping') return out({ ok: true, sheets: SpreadsheetApp.getActive().getSheets().map(function (s) { return s.getName(); }), name: SpreadsheetApp.getActive().getName() });
    if (action === 'load') return out({ ok: true, tables: loadAll() });
    return out({ ok: false, error: 'unknown action ' + action });
  } catch (err) { return out({ ok: false, error: String(err) }); }
}

function doPost(e) {
  try {
    var body = JSON.parse(e.postData.contents);
    if (body.action === 'save') { var n = saveTables(body.tables || {}, !!body.all); return out({ ok: true, saved: n }); }
    if (body.action === 'clear') { clearAll(); return out({ ok: true }); }
    return out({ ok: false, error: 'unknown action ' + body.action });
  } catch (err) { return out({ ok: false, error: String(err) }); }
}

function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function norm(c) {
  if (c instanceof Date) {
    var tz = Session.getScriptTimeZone();
    var hasTime = c.getHours() || c.getMinutes();
    return Utilities.formatDate(c, tz, hasTime ? "yyyy-MM-dd'T'HH:mm" : 'yyyy-MM-dd');
  }
  return c;
}

function loadAll() {
  var ss = SpreadsheetApp.getActive(), res = {};
  ss.getSheets().forEach(function (sh) {
    var v = sh.getDataRange().getValues();
    if (!v.length || !v[0].some(function (c) { return c !== ''; })) return;
    var headers = v[0].map(function (h) { return String(h); });
    var rows = v.slice(1).filter(function (r) { return r.some(function (c) { return c !== ''; }); }).map(function (r) { return r.map(norm); });
    res[sh.getName()] = { headers: headers, rows: rows };
  });
  return res;
}

function saveTables(tables, all) {
  var ss = SpreadsheetApp.getActive();
  var lock = LockService.getScriptLock(); lock.waitLock(30000);
  var n = 0;
  try {
    Object.keys(tables).forEach(function (name) {
      var t = tables[name]; if (!t || !t.headers) return;
      var sh = ss.getSheetByName(name) || ss.insertSheet(name);
      sh.clearContents();
      var data = [t.headers].concat(t.rows.map(function (r) { return t.headers.map(function (_, i) { var v = r[i]; return v == null ? '' : v; }); }));
      if (t.headers.length) {
        var rng = sh.getRange(1, 1, data.length, t.headers.length);
        rng.setNumberFormat('@');           // текст: даты и номера не превращаются в даты/числа
        rng.setValues(data);
        sh.getRange(1, 1, 1, t.headers.length).setFontWeight('bold').setBackground('#e3eef7');
      }
      sh.setFrozenRows(1);

function runDataSourceAction(act) {

    case 'dsPing': setRemoteState('busy'); remotePing().then(r => { setRemoteState('ok'); toast('Связь есть: таблица «' + r.name + '», листов: ' + (r.sheets || []).length + (r.sheets.some(s => SHEET_KEYS[s]) ? '' : ' (данных прототипа пока нет — выгрузите)'), 'ok', 6000); render(); }).catch(e => { setRemoteState('err', e.message); toast('Нет связи: ' + e.message, 'err', 9000); render(); }); return;

    case 'dsLoad': confirmDialog('Загрузить данные из таблиц?', 'Данные в этом браузере будут заменены содержимым Google Таблицы. Остатки и агрегаты пересчитаются из документов.', () => { remoteLoad().then(() => render()); }, 'Загрузить'); return;
    case 'dsOff': REMOTE.url = ''; REMOTE.snap = {}; saveRemoteCfg(); setRemoteState('off'); toast('Источник отключён, данные остаются в браузере', 'ok'); render(); return;
    case 'dsCopy': { const ta = document.getElementById('gsCode'); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => toast('Скрипт скопирован', 'ok')); } catch (e) { document.execCommand('copy'); toast('Скрипт скопирован', 'ok'); } return; }

const ARCH_BY_KEY = Object.fromEntries(ARCH_TABLES.map(t => [t.key, t]));

['Тип переработчика', 'аффинажный завод (финальный); промежуточный переработчик'], ['Тип счёта', 'площадка актива; переработчик; склад перевозчика'], ['Способ доставки', 'Автотранспорт; Авиа; ЖД (только концентрат)'], ['Источник итоговых показателей', 'наша; переработчика; арбитраж'], ['Тип начисления', 'предварительное; финальное'], ['Тип транзакции УМС', 'начисление; списание; корректировка'], ['Стадия продукции', 'полуфабрикат; готовая продукция'], ['Тип покупателя', 'банк РФ; юрлицо РФ, не являющееся банком; экспортёр'], ['Форма продажи', 'с НДС; без НДС; экспорт'], ['Валюта', 'рубль; доллар США; евро'], ['Условия оплаты', 'полная предоплата; частичная предоплата; постоплата'], ['Чья логистика', 'наша; покупателя'], ['Степень исполнения', 'нет; частично; полностью'], ['Отгрузка контракта', 'не передано; передано; получено'], ['Тип платежа', 'аванс; окончательный платёж; полная оплата [Дополнить]'],
];

/* ============================================================
   СТРАНИЦА «АРХИТЕКТУРА ДАННЫХ»: схема разделов, таблиц и связей (SVG)
   + карточки таблиц с полным составом атрибутов + наполнение справочников.
   ============================================================ */
'use strict';

UI.arch = UI.arch || { mode: 'key', links: true, scale: 'fit', focus: null };

/* колонки схемы: порядок слева направо; секция refs разбита на две колонки */
const ARCH_COLUMNS = [
  { sec: 'refs', title: 'Справочники', tables: ['groups', 'assets', 'processors', 'carriers', 'locations', 'metals', 'productTypes'] },
  { sec: 'refs', title: '', tables: ['clients', 'users', 'deliveryTerms', 'arbThresholds', 'calendar', 'params', 'lists'] },
  { sec: 'proc', title: 'Переработка', tables: ['procContracts', 'conditions', 'rules', 'shipments', 'lots', 'accruals'] },
  { sec: 'acc', title: 'Учёт металла', tables: ['accounts', 'transactions', 'transfers', 'limits', 'limitAdjustments', 'reconciliations'] },
  { sec: 'sales', title: 'Реализация', tables: ['deals', 'salesContracts', 'payments'] },
  { sec: 'after', title: 'После MVP', tables: ['licenseApps', 'planRows', 'items'] },
  { sec: 'sys', title: 'Системное', tables: ['events', 'tasks', 'comments'] },
];
const ARCH_W = 236, ARCH_GAP_X = 46, ARCH_PAD = 14, ARCH_HEAD = 40, ARCH_ROW = 16.5, ARCH_GAP_Y = 22, ARCH_TOP = 44;

function archFields(t) { return UI.arch.mode === 'all' ? t.fields : t.fields.filter(f => f.key || f.t === 'ref' && UI.arch.mode === 'keyrefs'); }
function archFit(str, px, cw) { const n = Math.max(6, Math.floor(px / cw)); return str.length > n ? str.slice(0, n - 1) + '…' : str; }
function archScale(W) { if (UI.arch.scale !== 'fit') return UI.arch.scale; const m = document.getElementById('main'); const avail = (m ? m.clientWidth : 1200) - 76; return Math.max(0.35, Math.min(1.2, avail / W)); }
function archRowCount(key) { return key === 'lists' ? ARCH_LISTS.length : key === 'params' ? Object.keys(DB.params || {}).length : (DB[key] || []).length; }

function archLayout() {
  const boxes = {}; let x = ARCH_PAD; const cols = [];
  ARCH_COLUMNS.forEach((col, ci) => {
    let y = ARCH_TOP; const sec = ARCH_SECTIONS.find(s => s.key === col.sec);
    col.tables.forEach(k => { const t = ARCH_BY_KEY[k]; const fs = archFields(t); const h = ARCH_HEAD + fs.length * ARCH_ROW + 10; boxes[k] = { x, y, w: ARCH_W, h, t, fs, col: ci, sec }; y += h + ARCH_GAP_Y; });
    cols.push({ x, w: ARCH_W, h: y - ARCH_GAP_Y, col, sec }); x += ARCH_W + ARCH_GAP_X;
  });
  const H = Math.max(...cols.map(c => c.h)) + ARCH_PAD; const W = x - ARCH_GAP_X + ARCH_PAD;
  return { boxes, cols, W, H };
}

function archSvg() {
  const L = archLayout(); const { boxes } = L; const showLinks = UI.arch.links; const focus = UI.arch.focus;
  /* полосы разделов (объединяем две колонки справочников) */
  const bands = []; ARCH_SECTIONS.forEach(sec => { const cs = L.cols.filter(c => c.sec.key === sec.key); if (!cs.length) return; const x0 = Math.min(...cs.map(c => c.x)) - 10, x1 = Math.max(...cs.map(c => c.x + c.w)) + 10; bands.push({ sec, x: x0, w: x1 - x0, h: Math.max(...cs.map(c => c.h)) + 4 }); });
  let s = '';
  bands.forEach(b => { s += `<rect x="${b.x}" y="8" width="${b.w}" height="${b.h}" rx="10" fill="${b.sec.bg}" stroke="${b.sec.color}" stroke-opacity=".35" stroke-dasharray="4 3"/><text x="${b.x + 12}" y="28" class="band" fill="${b.sec.color}">${esc(b.sec.name.toUpperCase())}</text>${b.w > 400 ? `<text x="${b.x + b.w - 12}" y="28" class="band-sub" text-anchor="end" fill="${b.sec.color}">НСИ · в ELMA365 — справочники</text>` : ''}`; });
  /* связи */
  let links = '';
  if (showLinks) Object.values(boxes).forEach(b => {
    b.fs.forEach((f, i) => {
      if (!f.ref || !boxes[f.ref]) return; const tb = boxes[f.ref]; const target = ARCH_BY_KEY[f.ref];
      const y1 = b.y + ARCH_HEAD + i * ARCH_ROW + ARCH_ROW / 2 - 1;
      const self = tb === b; const dir = tb.x > b.x ? 1 : tb.x < b.x ? -1 : 0;
      let x1, x2, y2, d;
      if (self) { x1 = b.x + b.w; y2 = b.y + ARCH_HEAD / 2; d = `M${x1},${y1} C${x1 + 30},${y1} ${x1 + 30},${y2} ${x1},${y2}`; }
      else if (dir === 0) { x1 = b.x; y2 = tb.y + ARCH_HEAD / 2; d = `M${x1},${y1} C${x1 - 26},${y1} ${x1 - 26},${y2} ${tb.x},${y2}`; }
      else { x1 = dir > 0 ? b.x + b.w : b.x; x2 = dir > 0 ? tb.x : tb.x + tb.w; y2 = tb.y + ARCH_HEAD / 2; const cx = (x1 + x2) / 2; d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`; }
      const dim = focus && focus !== b.t.key && focus !== f.ref;
      links += `<path d="${d}" class="lnk ${focus && !dim ? 'hl' : ''} ${dim ? 'dim' : ''}" data-from="${b.t.key}" data-to="${f.ref}" stroke="${tb.sec.color}" marker-end="url(#arr-${tb.sec.key})"/>`;
    });
  });
  /* таблицы */
  let nodes = '';
  Object.values(boxes).forEach(b => {
    const t = b.t; const n = archRowCount(t.key); const dim = focus && focus !== t.key && !b.fs.some(f => f.ref === focus) && !(boxes[focus] && boxes[focus].fs.some(f => f.ref === t.key));
    nodes += `<g class="tbl ${dim ? 'dim' : ''} ${focus === t.key ? 'focus' : ''}" data-key="${t.key}" transform="translate(${b.x},${b.y})">
      <rect width="${b.w}" height="${b.h}" rx="6" class="box" stroke="${b.sec.color}"/>
      <rect width="${b.w}" height="${ARCH_HEAD}" rx="6" fill="${b.sec.color}"/><rect y="${ARCH_HEAD - 8}" width="${b.w}" height="8" fill="${b.sec.color}"/>
      <text x="10" y="17" class="tname">${esc(archFit(t.name, b.w - 70, 7.2))}</text><text x="10" y="31" class="tkey">${t.key}${t.single ? '' : ' · ' + n + ' зап.'}</text>
      <text x="${b.w - 8}" y="17" class="tstage" text-anchor="end">${esc(ARCH_STAGE[t.stage] || '')}</text>
      ${b.fs.map((f, i) => { const y = ARCH_HEAD + i * ARCH_ROW + 12; const isRef = f.t === 'ref' || (f.t === 'list' && f.ref); const tl = isRef ? (ARCH_BY_KEY[f.ref] ? ARCH_BY_KEY[f.ref].name.split(' ')[0] : '') : (ARCH_TYPE_LABEL[f.t] || f.t); return `<text x="10" y="${y}" class="fld ${isRef ? 'ref' : ''} ${f.key ? 'key' : ''}">${isRef ? '→ ' : ''}${esc(archFit(f.l, b.w - 24 - tl.length * 5.4, 6.1))}</text><text x="${b.w - 8}" y="${y}" class="ftype" text-anchor="end">${esc(tl)}</text>`; }).join('')}
      ${UI.arch.mode !== 'all' && t.fields.length > b.fs.length ? `<text x="10" y="${b.h - 4}" class="more">… ещё ${t.fields.length - b.fs.length} атрибутов</text>` : ''}
    </g>`;
  });
  const defs = `<defs>${ARCH_SECTIONS.map(sec => `<marker id="arr-${sec.key}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${sec.color}"/></marker>`).join('')}</defs>`;
  const sc = archScale(L.W);
  return `<svg class="arch" xmlns="http://www.w3.org/2000/svg" width="${L.W * sc}" height="${L.H * sc}" viewBox="0 0 ${L.W} ${L.H}">${defs}${s}${links}${nodes}</svg>`;
}

const ARCH_STAGE = { mvp1: 'MVP-1', mvp2: 'MVP-2', after: 'после MVP', proto: 'прототип' };

function archExample(t, f) {
  if (t.key === 'lists') return f.k === 'name' ? ARCH_LISTS[0][0] : ARCH_LISTS[0][1];
  if (t.key === 'params') return f.k === 'today' ? DB.today : DB.params[f.k];
  const row = (DB[t.key] || []).find(r => r[f.k] != null && r[f.k] !== ''); if (!row) return '';
  const v = row[f.k]; if (Array.isArray(v)) return v.slice(0, 3).join(', ') + (v.length > 3 ? '…' : ''); return String(v);
}

      <span class="spacer"></span>

function runArchAction(act, el) {
  switch (act) {
    case 'archMode': UI.arch.mode = el.dataset.id; render(); return;
    case 'archLinks': UI.arch.links = el.checked; render(); return;
    case 'archZoom': { const d = el.dataset.id; const cur = UI.arch.scale === 'fit' ? archScale(archLayout().W) : UI.arch.scale; UI.arch.scale = d === '+' ? Math.min(1.6, +(cur + 0.1).toFixed(2)) : d === '-' ? Math.max(0.35, +(cur - 0.1).toFixed(2)) : 'fit'; render(); return; }
    case 'archFocus': UI.arch.focus = el.dataset.id || null; render(); if (UI.arch.focus) setTimeout(() => { const d = document.getElementById('archDetail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); return;
  }
}
function bindArch() {
  const wrap = document.getElementById('archWrap'); if (!wrap) return;
  wrap.querySelectorAll('g.tbl').forEach(g => {
    g.addEventListener('mouseenter', () => { if (UI.arch.focus) return; const k = g.dataset.key; wrap.querySelectorAll('path.lnk').forEach(p => { const on = p.dataset.from === k || p.dataset.to === k; p.classList.toggle('hl', on); p.classList.toggle('dim', !on); }); });
    g.addEventListener('mouseleave', () => { if (UI.arch.focus) return; wrap.querySelectorAll('path.lnk').forEach(p => { p.classList.remove('hl'); p.classList.remove('dim'); }); });
    g.addEventListener('click', () => { UI.arch.focus = g.dataset.key; render(); setTimeout(() => { const d = document.getElementById('archDetail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); });
  });
}

function parseRoute() { let h = UI.route || ''; try { h = decodeURIComponent(h.replace(/^#\/?/, '')); } catch (e) { h = h.replace(/^#\/?/, ''); } const [page, ...rest] = h.split('/'); return { page: page || 'overview', id: rest.join('/') || null, path: h }; }

function globalSearch(q) {

  vis.accounts().forEach(a => add('УМС', H.account(a.id), `${a.id} · ${accountName(a)} · ${fmtKg(a.balance)}`));

  vis.limits().forEach(l => add('Лимит', H.limit(l.id), `${l.name} · ${l.status}`));
  vis.procContracts().forEach(c => add('Договор', H.procContract(c.id), `${c.no} · ${assetName(c.assetId)} × ${procName(c.procId)}`));
  vis.accruals().forEach(a => add('Начисление', H.accrual(a.id), `${a.id} · ${a.lotId} · ${a.metal} · ${a.status}`));
  DB.clients.forEach(c => add('Клиент', '#/refs/clients', c.name));

  return out;
}

    case 'editTransfer': return formEditTransfer(transfer(id));
    case 'changeTransfer': return formChangeTransfer(transfer(id));
    case 'statusTransfer': return formSetStatus('transfer', transfer(id), ['Проведено', 'Отменено']);
    case 'deleteTransfer': return askDelete('transfer', id, '#/transfers');
    case 'editLimit': return formEditLimit(limit(id));
    case 'deleteAdj': return askDelete('adjustment', el.dataset.id);
    case 'deleteCorr': return askDelete('correction', el.dataset.id);
    case 'refAdd': return refForm(el.dataset.coll, null);
    case 'refEdit': return refForm(el.dataset.coll, el.dataset.id);
    case 'refDel': return refDeleteAsk(el.dataset.coll, el.dataset.id);
    case 'addTask': return formAddTask(CARD_PAGES[r.page], id);
    case 'toggleTask': return wrap(() => { const t = DB.tasks.find(x => x.id === el.dataset.id); t.done = !t.done; });
    case 'delTask': return wrap(() => { DB.tasks = DB.tasks.filter(x => x.id !== el.dataset.id); });
    case 'addComment': { const ta = document.getElementById('cmtText'); const text = ta && ta.value.trim(); if (!text) { toast('Введите текст сообщения', 'warn'); return; } return wrap(() => { addComment(CARD_PAGES[r.page], id, text); }); }
    case 'giisReport': return openForm({ title: 'Отчёт о переходе собственности в ГИИС ДМДК', tag: stage('proto'), note: '<div class="note info">5 календарных дней после передачи металла (блок 11 схемы процесса). В ТЗ отчётность не описана — показано как задача со сроком.</div>', fields: [{ name: 'date', label: 'Дата подачи', type: 'date', value: DB.today, required: true, max: DB.today }], submit: v => { salesContract(id).giisReported = v.date; logEvent('contract', id, 'Подан отчёт в ГИИС ДМДК ' + fmtD(v.date)); toast('Отчёт отмечен', 'ok'); }, submitLabel: 'Подано' });
    case 'rfmReport': return openForm({ title: 'Отчёт в Росфинмониторинг', tag: stage('proto'), note: '<div class="note info">3 рабочих дня после поступления денег (блок 11 схемы процесса).</div>', fields: [{ name: 'date', label: 'Дата подачи', type: 'date', value: DB.today, required: true, max: DB.today }], submit: v => { payment(id).rfmReported = v.date; logEvent('payment', id, 'Подан отчёт в Росфинмониторинг ' + fmtD(v.date)); toast('Отчёт отмечен', 'ok'); }, submitLabel: 'Подано' });
    case 'newRecon': return formNewRecon(r.page === 'accounts' ? id : null);
    case 'reconCorrect': { const rc = DB.reconciliations.find(x => x.id === el.dataset.id); return openForm({ title: 'Корректировка по итогам сверки ' + rc.id, tag: stage('mvp1', '3.3.8'), note: `<div class="note warn">Администратор приводит остаток ${esc(accountName(account(rc.accountId)))} к выписке завода. Это ручная транзакция без документа-основания.</div>`, fields: [{ name: 'qty', label: 'Количество, г (со знаком)', type: 'number', step: '0.1', value: rc.diff, required: true }, { name: 'date', label: 'Дата', type: 'date', value: DB.today, required: true, max: DB.today }, { name: 'comment', label: 'Причина', type: 'textarea', value: 'По акту сверки ' + rc.id + ' за ' + rc.period + (rc.comment ? ': ' + rc.comment : ''), required: true, full: true }], submit: v => { addCorrection(account(rc.accountId), v.qty, v.date, v.comment); rc.status = 'Сверено'; rc.comment = (rc.comment ? rc.comment + '. ' : '') + 'Закрыто корректировкой ' + fmtD(v.date); toast('Корректировка проведена, акт закрыт', 'ok'); } }); }
    case 'editTolerance': return openForm({ title: 'Допуск полной оплаты', fields: [{ name: 'tol', label: 'Допуск, USD', type: 'number', step: '0.01', value: DB.params.payTolerance, required: true }], submit: v => { DB.params.payTolerance = v.tol; DB.deals.forEach(refreshDealStatus); toast('Допуск изменён, признаки оплаты пересчитаны', 'ok'); } });
  }
}

/* ---------- делегирование событий ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); return; }
  const menuBtn = t.closest('[data-menu]');
  document.querySelectorAll('.menu').forEach(m => { if (!menuBtn || m !== menuBtn.nextElementSibling) m.classList.add('hidden'); });
  if (menuBtn) { menuBtn.nextElementSibling.classList.toggle('hidden'); return; }
  if (t.closest('[data-close-card]')) { e.preventDefault(); closeCard(); return; }
  const act = t.closest('[data-act]');
  if (act) { if (act.classList.contains('dis') || act.disabled) return; e.preventDefault(); runAction(act.dataset.act, parseRoute(), act); return; }
  const tab = t.closest('[data-tab]'); if (tab) { const [id, key] = tab.dataset.tab.split('|'); UI.tab[id] = key; render(); return; }
  const sort = t.closest('[data-sort]'); if (sort) { const [id, key] = sort.dataset.sort.split('|'); const cur = UI.sort[id]; UI.sort[id] = cur && cur.key === key ? { key, dir: cur.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' }; render(); return; }
  const view = t.closest('[data-view]'); if (view) { const [id, v] = view.dataset.view.split('|'); UI.view[id] = v; render(); return; }
  const quick = t.closest('[data-quick]'); if (quick) { const [id, key] = quick.dataset.quick.split('|'); UI.filters[id] = UI.filters[id] || { q: '' }; UI.filters[id]['quick_' + key] = !UI.filters[id]['quick_' + key]; render(); return; }
  const row = t.closest('[data-href]'); if (row && !t.closest('a') && !t.closest('button')) { go(row.dataset.href); return; }
});
document.addEventListener('change', e => { if (e.target.hasAttribute('data-archlinks')) { UI.arch.links = e.target.checked; render(); return; } const f = e.target.closest('[data-filter]'); if (f) { const [id, key] = f.dataset.filter.split('|'); UI.filters[id] = UI.filters[id] || { q: '' }; UI.filters[id][key] = f.value; render(); } });
document.addEventListener('input', e => { const s = e.target.closest('[data-search]'); if (s) { const id = s.dataset.search; UI.filters[id] = UI.filters[id] || { q: '' }; UI.filters[id].q = s.value; const pos = s.selectionStart; render(); const n = document.querySelector(`[data-search="${id}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const hadForm = !!document.getElementById('overlay'); closeModal(); document.querySelectorAll('.menu').forEach(m => m.classList.add('hidden')); if (!hadForm && document.getElementById('cardOverlay')) closeCard(); } });
window.addEventListener('hashchange', () => { if (location.hash && location.hash !== UI.route) { UI.route = location.hash; closeModal(); render(); } });

/* ---------- старт ---------- */
(function start() {
  loadRemoteCfg();
  const restored = restore(); if (!restored) buildClean();   // первый запуск — чистая система; дальше запоминается последний выбор
  let advanced = null; if (restored && DB.today < REAL_TODAY) { try { const from = DB.today; const n = setToday(REAL_TODAY); advanced = { from, n }; persist(); } catch (e) { } }
  loadTheme();
  UI.route = (location.hash && location.hash.startsWith('#/')) ? location.hash : '#/overview';
  render();
  if (REMOTE_ENABLED && REMOTE.url) { remoteLoad({ silent: true }).then(ok => { render(); if (ok) toast('Данные загружены из Google Таблиц', 'ok'); else toast('Google Таблицы недоступны: ' + (REMOTE.error || '') + '. Показаны данные из этого браузера.', 'err', 9000); }); }
  else if (advanced) toast(`Учётная дата продвинута с ${fmtD(advanced.from)} до сегодня (${fmtD(DB.today)}); планировщик исполнил начислений: ${advanced.n}.`, 'ok', 8000);
  else if (UI.savedAt) toast('Загружено сохранённое состояние из этого браузера (' + fmtDT(UI.savedAt) + '). «Сбросить демоданные» вернёт исходный набор.', '', 6000);
})();

</script>
</body>
</html>
