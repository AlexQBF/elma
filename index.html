<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELMA365 demo · коммерческий блок</title>
<meta name="description" content="Прототип системы учёта МПФ, переработки и реализации драгметаллов.">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f2f4f7;--panel:#fff;--line:#e3e7ee;--line2:#d4d9e2;
  --text:#1f2937;--muted:#6b7280;--muted2:#9aa3b2;
  --accent:#2f6fed;--accent-h:#2458c7;--accent-bg:#eaf1fe;
  --green:#1e9e63;--green-bg:#e6f6ee;--amber:#c77d0c;--amber-bg:#fff4e0;
  --red:#d6403a;--red-bg:#fdeceb;--grey-bg:#eef0f4;--violet:#6d4fd1;--violet-bg:#efeafb;
  --side-w:244px;--top-h:52px;--radius:8px;
  --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);line-height:1.4}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:19px}
h2{font-size:15px}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mono{font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
.neg{color:var(--red);font-weight:600}
.pos{color:var(--green)}
.warn{color:var(--amber)}
.hidden{display:none!important}

/* layout */
#app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:var(--top-h) 1fr;height:100vh}
#top{grid-column:1/3;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:14px;z-index:5}
#side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 0 24px}
#main{overflow:auto;padding:18px 24px 48px;min-width:0}
#top .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--text);margin-right:6px}
#top .logo .mark{width:26px;height:26px;border-radius:7px;background:#5b3fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
#top .logo .sub{font-weight:400;color:var(--muted);font-size:12px}
#top .search{flex:0 1 380px;position:relative}
#top .search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 10px 0 32px;font-size:13px;background:#fafbfc}
#top .search input:focus{outline:none;border-color:var(--accent);background:#fff}
#top .search .ico{position:absolute;left:10px;top:8px;color:var(--muted2)}
#top .search .results{position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:380px;overflow:auto;z-index:50}
#top .search .results div{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
#top .search .results div:hover{background:var(--accent-bg)}
#top .search .results .k{font-size:11px;color:var(--muted);width:92px;flex:none}
#top .spacer{flex:1}
#top .demo-badge{background:var(--amber-bg);color:#8a5a06;border:1px solid #f1d9a6;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap}
#top .today{color:var(--muted);font-size:12px;white-space:nowrap}
#top select{height:30px;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:0 6px;font-size:12px;max-width:240px}
#top .user{display:flex;align-items:center;gap:8px;font-size:12px}
#top .avatar{width:28px;height:28px;border-radius:50%;background:var(--violet-bg);color:var(--violet);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}

#side .grp{padding:12px 16px 4px;font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#side a.item{display:flex;align-items:center;gap:9px;padding:7px 16px 7px 18px;color:var(--text);border-left:3px solid transparent;text-decoration:none}
#side a.item:hover{background:#f6f8fb}
#side a.item.active{background:var(--accent-bg);border-left-color:var(--accent);color:var(--accent);font-weight:600}
#side a.item svg{width:16px;height:16px;flex:none;opacity:.75}
#side a.item .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--grey-bg);border-radius:10px;padding:0 6px}
#side a.item.sub{padding-left:43px;font-size:12.5px}
#side .tag-after{margin-left:auto;font-size:9.5px;color:var(--violet);background:var(--violet-bg);border-radius:4px;padding:1px 4px;font-weight:600;white-space:nowrap}
#side .foot{padding:14px 16px;font-size:11px;color:var(--muted2);line-height:1.5}
#side .after-block{background:#f6f3fd;border-top:1px solid #e6def8;border-bottom:1px solid #e6def8;margin:8px 0;padding-bottom:6px}
#side .after-block .grp{color:var(--violet)}
#side .after-block a.item:hover{background:#efe9fb}
#side .after-block a.item.active{background:#e7defa;border-left-color:var(--violet);color:var(--violet)}

/* page header */
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.ph .t{flex:1;min-width:240px}
.ph .crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}
.ph .crumbs a{color:var(--muted)}
.ph .title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .sub{color:var(--muted);margin-top:3px;font-size:12.5px}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--text);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#f6f8fb;border-color:#c5ccd8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.danger{color:var(--red);border-color:#f0c2bf}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--grey-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.btn-group{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.btn-group .btn{border:0;border-radius:0;height:30px}
.btn-group .btn.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:230px;z-index:40;padding:4px 0}
.menu div{padding:7px 12px;cursor:pointer}
.menu div:hover{background:var(--accent-bg)}
.menu div.dis{color:var(--muted2);cursor:not-allowed}
.menu div.dis:hover{background:none}
.menu .sep{height:1px;background:var(--line);margin:4px 0;padding:0}
.menu .hd{font-size:11px;color:var(--muted2);text-transform:uppercase;padding:6px 12px 2px;cursor:default}
.menu .hd:hover{background:none}

/* badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5;background:var(--grey-bg);color:#4b5563}
.badge.blue{background:var(--accent-bg);color:var(--accent)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.violet{background:var(--violet-bg);color:var(--violet)}
.badge.grey{background:var(--grey-bg);color:#4b5563}
.badge.outline{background:#fff;border:1px solid var(--line2);color:var(--muted)}
.stage{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:1px 5px;vertical-align:middle}
.stage.mvp1{background:var(--green-bg);color:var(--green)}
.stage.mvp2{background:var(--accent-bg);color:var(--accent)}
.stage.after{background:var(--violet-bg);color:var(--violet)}
.stage.proto{background:var(--amber-bg);color:var(--amber)}
.stage.q{background:var(--red-bg);color:var(--red)}
.metal{display:inline-block;font-weight:700;font-size:11px;border-radius:4px;padding:1px 5px}
.metal.Au{background:#fdf2d0;color:#8a6508}
.metal.Ag{background:#e9ecf2;color:#4b5563}

/* cards/panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.panel .pt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel .pt h2{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid2>*,.grid3>*,.grid4>*,.two>*{min-width:0}
@media (max-width:1250px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* field grid */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px}
.fields.c2{grid-template-columns:1fr 1fr}
.fields.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.fields,.fields.c4{grid-template-columns:1fr 1fr}}
.f{padding:4px 0;border-bottom:1px dashed var(--line);min-width:0}
.f .l{font-size:11.5px;color:var(--muted);margin-bottom:1px}
.f .v{font-size:13px;word-break:break-word}
.f .v.big{font-size:17px;font-weight:600}
.f.span2{grid-column:span 2}
.f.span3{grid-column:1/-1}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs a{padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;text-decoration:none}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs a .cnt{font-size:11px;background:var(--grey-bg);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);background:#f8f9fb;white-space:nowrap;position:sticky;top:0;z-index:1;user-select:none}
table.tbl th.sortable{cursor:pointer}
table.tbl th.sortable:hover{color:var(--text)}
table.tbl th .arr{font-size:9px;margin-left:3px;color:var(--accent)}
table.tbl th.num{text-align:right}
table.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr.row{cursor:pointer}
table.tbl tbody tr.row:hover{background:#f6f9ff}
table.tbl tr.total td{background:#f8f9fb;font-weight:600;border-top:2px solid var(--line2)}
table.tbl td.empty{text-align:center;color:var(--muted);padding:26px}
table.tbl.compact td,table.tbl.compact th{padding:5px 8px}
table.tbl tr.hl td{background:#fff8e6}
table.tbl tr.dim td{color:var(--muted2)}
.chk{color:var(--green)}

/* list toolbar */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar input[type=text],.toolbar select{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 8px;font-size:12.5px;background:#fff}
.toolbar input[type=text]{min-width:220px}
.toolbar .cnt{color:var(--muted);font-size:12px;margin-left:auto}
.toolbar .chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-bg);color:var(--accent);border-radius:12px;padding:3px 8px;font-size:12px;cursor:pointer}

/* kanban */
.kanban{display:flex;gap:12px;overflow:auto;padding-bottom:8px;align-items:flex-start}
.kcol{flex:0 0 268px;background:#eceff4;border-radius:8px;padding:8px}
.kcol .kh{font-weight:600;font-size:12.5px;padding:4px 6px 8px;display:flex;justify-content:space-between;color:#374151}
.kcol .kh span{color:var(--muted);font-weight:500}
.kcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12px}
.kcard:hover{border-color:var(--accent);box-shadow:0 2px 6px rgba(47,111,237,.12)}
.kcard .kt{font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.kcard .km{color:var(--muted);line-height:1.5}

/* KPI tiles */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:88px}
.kpi .kl{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.kpi .kv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .ks{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.kpi .kv .u{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .row2{display:flex;gap:18px}
.kpi.warn{border-left:3px solid var(--amber)}
.kpi.bad{border-left:3px solid var(--red)}
.kpi.ok{border-left:3px solid var(--green)}

.bar{height:7px;background:var(--grey-bg);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.amber{background:var(--amber)}
.bar i.red{background:var(--red)}
.bar i.green{background:var(--green)}

/* notes/alerts */
.note{border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;border:1px solid}
.note.info{background:var(--accent-bg);border-color:#c7d9fb;color:#1e3f85}
.note.warn{background:var(--amber-bg);border-color:#f1d9a6;color:#7a4e03}
.note.err{background:var(--red-bg);border-color:#f0c2bf;color:#8f2420}
.note.ok{background:var(--green-bg);border-color:#bfe8d2;color:#145c3b}
.note.after{background:var(--violet-bg);border-color:#d7ccf5;color:#4a2f9c}
.note b{font-weight:600}
.note ul{margin:4px 0 0 18px;padding:0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:10px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .12s ease-out}
.modal.wide{width:860px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h2{flex:1}
.modal .mh .x{cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.modal .mb{padding:14px 18px;max-height:70vh;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal .mf .left{margin-right:auto;font-size:12px;color:var(--muted)}
.modal .mf .left.err{color:var(--red);font-weight:600}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.form .fld{display:flex;flex-direction:column;gap:3px}
.form .fld.full{grid-column:1/-1}
.form label{font-size:11.5px;color:var(--muted)}
.form label .req{color:var(--red)}
.form input,.form select,.form textarea{height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;font-size:13px;font-family:inherit;background:#fff;width:100%}
.form textarea{height:64px;padding:6px 9px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,237,.15)}
.form input[readonly]{background:#f8f9fb;color:var(--muted)}
.form .hint{font-size:11px;color:var(--muted2)}
.form .sect{grid-column:1/-1;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.live{grid-column:1/-1;background:#f8f9fb;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12.5px;line-height:1.6}
.live .lr{display:flex;justify-content:space-between;gap:12px}
.live .lr b{font-variant-numeric:tabular-nums}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#1f2937;color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:420px;animation:pop .15s}
.toast.ok{background:#14532d}
.toast.warn{background:#7c4a03}
.toast.err{background:#8f2420}

/* timeline / lists */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.tl li .d{color:var(--muted);width:78px;flex:none;font-variant-numeric:tabular-nums}
.att{list-style:none;margin:0;padding:0}
.att li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.att li .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.blue{background:var(--accent)}.dot.grey{background:var(--muted2)}

/* chemistry table */
.chem th:first-child{min-width:150px}
.diff{font-size:11px;color:var(--muted)}
.diff.bad{color:var(--red);font-weight:600}

/* svg charts */
.chart{width:100%;height:210px;display:block}
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* misc */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv .k{color:var(--muted)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.ref{color:var(--accent);cursor:pointer}
.ref:hover{text-decoration:underline}
.rowacts{font-size:12px}
.rowacts a.neg{color:var(--red);font-weight:500}
.foot-note{font-size:11.5px;color:var(--muted2);margin-top:20px;line-height:1.5}
code{background:var(--grey-bg);padding:1px 5px;border-radius:4px;font-size:12px}
.sect-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.sect-title h2{flex:1}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.inline-kpi{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 12px}
.inline-kpi div{font-size:12px;color:var(--muted)}
.inline-kpi b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.help{cursor:help;border-bottom:1px dotted var(--muted2)}
.lot-stat{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.print-hide{}

/* ============================================================
   ТЕМА «ELMA365 строго»: по макету лида — без плашек, заливок и плиток
   ============================================================ */
body.theme-elma{
  --bg:#ffffff;--panel:#ffffff;--line:#e4e8ee;--line2:#cfd6de;
  --text:#1f2937;--muted:#6b7280;--muted2:#9aa3ad;
  --accent:#2f5f8f;--accent-h:#264d75;--accent-bg:#e6f0fa;
  --green:#1f2937;--green-bg:transparent;--amber:#1f2937;--amber-bg:transparent;
  --red:#c0392b;--red-bg:transparent;--grey-bg:#f3f5f8;--violet:#1f2937;--violet-bg:transparent;
  --side-w:350px;--top-h:64px;--radius:4px;
  --font:-apple-system,"SF Pro Text",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --e-navy:#1d3a5c;--e-navy2:#2d5a86;--e-menu:#eef2f7;--e-menu-on:#dde7f1;--e-link:#2a64a8;
  font-size:14px;
}

<body>
<div id="app">
  <div id="top"></div>
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<script>
/* ============================================================
   ENGINE: учётная логика прототипа (по мотивам ТЗ v3.1)
   Остатки УМС, расход лимитов и объёмов договоров, агрегаты сделок
   считаются из документов и транзакций, а не хранятся как цифры.
   ============================================================ */
'use strict';

const REAL_TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const DEMO_TODAY = REAL_TODAY;              // учётная дата демо = реальная дата открытия; демонабор строится относительно неё
const DEMO_YEAR = Number(DEMO_TODAY.slice(0, 4));          // учётная дата демо (зафиксирована)
const OZ = 31.1034768;                    // тройская унция, г
const METALS = ['Au', 'Ag'];

let DB = null;                            // текущее состояние
let SEQ = {};                             // счётчики номеров

/* ---------- утилиты ---------- */
const r1 = x => Math.round(x * 10) / 10;
const r2 = x => Math.round(x * 100) / 100;
const r4 = x => Math.round(x * 10000) / 10000;
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const byId = (coll, id) => (DB[coll] || []).find(x => x.id === id);
const nextNo = (prefix, pad = 3) => { SEQ[prefix] = (SEQ[prefix] || 0) + 1; return prefix + '-' + String(SEQ[prefix]).padStart(pad, '0'); };
const cmpDate = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const minDate = (a, b) => a < b ? a : b;
const maxDate = (a, b) => a > b ? a : b;
const clone = x => JSON.parse(JSON.stringify(x));

function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }
function isWorkDay(iso) {
  const cal = DB.calendar.find(c => c.date === iso);
  if (cal) return cal.work;
  const dow = new Date(iso + 'T00:00:00Z').getUTCDay();
  return dow !== 0 && dow !== 6;
}
function addBusinessDays(iso, n) { let d = iso, k = 0; while (k < n) { d = addDays(d, 1); if (isWorkDay(d)) k++; } return d; }

/* ---------- справочные геттеры ---------- */
const asset = id => byId('assets', id);
const group = id => byId('groups', id);
const processor = id => byId('processors', id);
const carrier = id => byId('carriers', id);
const locById = id => byId('locations', id);
const client = id => byId('clients', id);
const user = id => byId('users', id) || { id, name: '—', role: 'viewer', roleName: 'Пользователь удалён', groupId: null, companyLevel: false };
const productType = id => byId('productTypes', id);
const procContract = id => byId('procContracts', id);
const shipment = id => byId('shipments', id);
const lot = id => byId('lots', id);
const accrual = id => byId('accruals', id);
const deal = id => byId('deals', id);
const salesContract = id => byId('salesContracts', id);
const payment = id => byId('payments', id);
const account = id => byId('accounts', id);
const transfer = id => byId('transfers', id);
const limit = id => byId('limits', id);

function assetName(id) { const a = asset(id); return a ? a.name : '—'; }
function locName(id) { const l = locById(id); return l ? l.name : '—'; }
function procName(id) { const p = processor(id); return p ? p.name : '—'; }
function procShort(id) { const l = DB.locations.find(x => x.ownerProc === id); return l ? l.name : procName(id); }
function fromShort(locId) { const l = locById(locId); return !l ? '—' : l.type === 'asset' ? 'площадка актива' : l.name; }
function isRefinery(procId) { const p = processor(procId); return p && p.type === 'refinery'; }
function locOfProcessor(procId) { return DB.locations.find(l => l.ownerProc === procId); }
function locOfAsset(assetId) { return DB.locations.find(l => l.ownerAsset === assetId); }
function locOfCarrier(carId) { return DB.locations.find(l => l.ownerCarrier === carId); }

/* ---------- УМС: ключ актив × тип × локация × металл ---------- */
function accountKeyFromLocation(assetId, locId, metal) {
  const l = locById(locId);
  if (!l) throw new Error('Локация не найдена: ' + locId);
  const type = l.type;                      // asset | processor | carrier
  const key = [assetId, type, type === 'asset' ? '' : locId, metal].join('|');
  return { key, type, locId: type === 'asset' ? null : locId };
}
function findAccountByLoc(assetId, locId, metal) {
  const { key } = accountKeyFromLocation(assetId, locId, metal);
  return DB.accounts.find(a => a.key === key) || null;
}
function findOrCreateAccount(assetId, locId, metal) {
  let acc = findAccountByLoc(assetId, locId, metal);
  if (acc) return acc;
  const { key, type, locId: lid } = accountKeyFromLocation(assetId, locId, metal);
  acc = { id: nextNo('УМС', 3), key, assetId, type, locId: lid, metal, balance: 0 };
  DB.accounts.push(acc);
  return acc;
}
function accountName(acc) {
  const typeName = { asset: 'площадка актива', processor: locName(acc.locId), carrier: locName(acc.locId) }[acc.type];
  return `${assetName(acc.assetId)} · ${typeName} · ${acc.metal}`;
}
function accountTxs(accId) { return DB.transactions.filter(t => t.accountId === accId); }
function balanceOnDate(accId, dateIso) { return r1(sum(accountTxs(accId).filter(t => t.date <= dateIso), t => t.qty)); }
function lastDayOfMonth(ym) { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m, 0)); return d.toISOString().slice(0, 10); }
function createReconciliation(acc, period, plantBalance, comment) {
  const ours = balanceOnDate(acc.id, lastDayOfMonth(period));
  const r = { id: nextNo('АС', 3), accountId: acc.id, assetId: acc.assetId, groupId: asset(acc.assetId).groupId, period, ourBalance: ours, plantBalance: r1(plantBalance), diff: r1(plantBalance - ours), status: Math.abs(plantBalance - ours) < 0.05 ? 'Сверено' : 'Расхождение', comment: comment || '', date: DB.today, author: DB.currentUserId, doc: `Акт сверки ${period}.pdf` };
  DB.reconciliations = DB.reconciliations || []; DB.reconciliations.push(r);
  logEvent('account', acc.id, `Акт сверки за ${period}: у нас ${fmtKg(ours)}, у завода ${fmtKg(plantBalance)}, расхождение ${fmtKg(r.diff)}`);
  return r;
}
function recalcAccount(accId) { const acc = account(accId); if (!acc) return; acc.balance = r1(sum(accountTxs(accId), t => t.qty)); }
function recalcAllAccounts() { DB.accounts.forEach(a => recalcAccount(a.id)); }

/* приводим транзакции документа к требуемому набору (идемпотентно) */
function reconcileTxs(basisField, basisId, wanted) {
  const existing = DB.transactions.filter(t => t[basisField] === basisId);
  const touched = new Set(existing.map(t => t.accountId));
  // если набор транзакций уже соответствует документу — ничего не трогаем (идемпотентность, стабильные номера)
  const key = t => [t.accountId, r1(t.qty), t.date, t.comment || ''].join('|');
  if (existing.length === wanted.length && existing.map(key).sort().join('\n') === wanted.map(key).sort().join('\n')) { touched.forEach(recalcAccount); return; }
  // иначе удаляем все и создаём заново: набор маленький, результат тот же
  DB.transactions = DB.transactions.filter(t => t[basisField] !== basisId);
  wanted.forEach(w => {
    const tx = { id: nextNo('ТР', 5), type: w.qty >= 0 ? 'Начисление' : 'Списание', ...w, createdAt: DB.nowStamp, author: DB.currentUserId };
    tx[basisField] = basisId;
    DB.transactions.push(tx);
    touched.add(w.accountId);
  });
  touched.forEach(recalcAccount);
}

/* ---------- Договоры, условия, правила ---------- */
function findProcContract(assetId, procId, productId, dateIso) {
  return DB.procContracts.find(c => c.assetId === assetId && c.procId === procId && c.productId === productId && c.status === 'Действует' && c.dateFrom <= dateIso && c.dateTo >= dateIso) || null;
}
function contractConditions(cid) { return DB.conditions.filter(c => c.contractId === cid).sort((a, b) => a.order - b.order); }
function contractRules(cid) { return DB.rules.filter(r => r.contractId === cid).sort((a, b) => a.metal.localeCompare(b.metal) || (a.type === 'final') - (b.type === 'final') || a.seq - b.seq); }
function pickCondition(cid, chem) {
  return contractConditions(cid).find(c => METALS.every(m => chem[m + '_conc'] >= c[m + '_from'] && chem[m + '_conc'] <= c[m + '_to'])) || null;
}
function contractVolumeUsed(cid, metal) {
  const sc = DB.salesContracts.filter(c => c.procContractId === cid && c.status !== 'Отменена' && dealMetal(c) === metal);
  const tr = DB.transfers.filter(t => t.status === 'Проведено' && t[metal + '_procContractId'] === cid);
  return r1(sum(sc, c => c.mass) + sum(tr, t => t[metal + '_mass']));
}

/* ---------- Лимиты ---------- */
function activeLimit(assetId, metal) { return DB.limits.find(l => l.assetId === assetId && l.metal === metal && l.status === 'Действует') || null; }
function limitInstalled(l) { return r1(l.volume + sum(DB.limitAdjustments.filter(a => a.limitId === l.id), a => a.qty)); }
function limitUsed(l) {
  const sc = DB.salesContracts.filter(c => c.limitId === l.id && c.status !== 'Отменена');
  const tr = DB.transfers.filter(t => t.status === 'Проведено' && t[l.metal + '_limitId'] === l.id);
  return r1(sum(sc, c => c.mass) + sum(tr, t => t[l.metal + '_mass']));
}
function limitRemaining(l) { return r1(limitInstalled(l) - limitUsed(l)); }
function limitPct(l) { const i = limitInstalled(l); return i > 0 ? Math.round(limitUsed(l) / i * 1000) / 10 : 0; }

/* ---------- Лот: химия и проведение (А4) ---------- */
function chemOf(lotObj, cut) { // cut: our | proc | arb | final
  const o = {};
  METALS.forEach(m => { o[m + '_conc'] = lotObj[m + '_conc_' + cut]; o[m + '_mass'] = lotObj[m + '_mass_' + cut]; });
  return o;
}
function cutFilled(lotObj, cut) {
  return METALS.every(m => lotObj[m + '_mass_our'] <= 0 || (lotObj[m + '_conc_' + cut] != null && lotObj[m + '_mass_' + cut] != null && (cut === 'our' || lotObj[m + '_yield_' + cut] != null)));
}
function calcPlannedYield(lotObj) {
  const cond = lotObj.condPlanId ? byId('conditions', lotObj.condPlanId) : null;
  METALS.forEach(m => { lotObj[m + '_yield_plan'] = cond ? r1(lotObj[m + '_mass_our'] * cond[m + '_extr'] / 100) : null; });
}
function postLot(lotObj) {
  const sh = shipment(lotObj.shipmentId);
  const fromLoc = locById(sh.fromLocId);
  const wanted = [];
  if (fromLoc.type === 'processor' && lotObj.status !== 'Отмена отправки') {
    METALS.forEach(m => {
      const mass = lotObj[m + '_mass_our'];
      if (mass > 0) {
        const acc = findOrCreateAccount(sh.assetId, sh.fromLocId, m);
        wanted.push({ accountId: acc.id, qty: -mass, date: sh.sentFact, comment: 'Отправка лота на следующий этап переработки' });
      }
    });
  }
  reconcileTxs('lotId', lotObj.id, wanted);
}
function checkArbitration(lotObj) { // А7: сравнение нашей химии и химии переработчика с порогами

    const th = DB.arbThresholds.find(t => t.metal === m);

}

/* ---------- Прибытие (А5): фиксация договора, создание начислений ---------- */
function arriveShipment(sh, dateIso) {
  if (sh.status !== 'Отправлена') throw new Error(`Прибытие отмечается для отгрузки в статусе «Отправлена» (сейчас «${sh.status}»).`);
  if (dateIso > DB.today) throw new Error('Дата прибытия не может быть позже учётной даты.');
  if (sh.sentFact && dateIso < sh.sentFact) throw new Error(`Дата прибытия ${fmtD(dateIso)} раньше даты отправки ${fmtD(sh.sentFact)}.`);
  const lots = DB.lots.filter(l => l.shipmentId === sh.id);
  if (!lots.length) throw new Error('В отгрузке нет лотов. Сначала добавьте лоты по спецификации (А1), затем отмечайте прибытие.');
  const contract = findProcContract(sh.assetId, sh.procId, sh.productId, dateIso);
  if (!contract) throw new Error(`Не найден действующий договор переработки: ${assetName(sh.assetId)} × ${procName(sh.procId)} × ${productType(sh.productId).name} на ${fmtD(dateIso)}. Переход в «Прибыла» заблокирован (А5).`);
  const plan = [];
  for (const l of lots) {
    const cond = pickCondition(contract.id, chemOf(l, 'our'));
    if (!cond) throw new Error(`Для лота ${l.id} (Au ${l.Au_conc_our}%, Ag ${l.Ag_conc_our}%) нет подходящего условия в договоре ${contract.no}. Переход всей отгрузки заблокирован (А5) — добавьте условие в договор.`);
    plan.push({ l, cond });
  }
  // сначала все проверки — затем все записи (3.4.9)
  sh.arrFact = dateIso; sh.status = 'Прибыла'; sh.procContractId = contract.id;
  const procLoc = locOfProcessor(sh.procId);
  let shipEnd = null;
  plan.forEach(({ l, cond }) => {
    l.status = 'Прибыла'; l.procContractId = contract.id; l.condPlanId = cond.id; l.docs = (l.docs || []).concat([`Предварительный акт приёмки ${l.id}.pdf`]);
    calcPlannedYield(l);
    let lotEnd = null;
    contractRules(contract.id).forEach(rule => {
      if (l[rule.metal + '_mass_our'] <= 0) return;
      const acc = findOrCreateAccount(sh.assetId, procLoc.id, rule.metal);
      const planDate = addBusinessDays(dateIso, rule.days);
      const yieldPlan = l[rule.metal + '_yield_plan'];
      let planMass;
      if (rule.type === 'prelim') planMass = r1(yieldPlan * rule.share / 100);
      else { const prel = contractRules(contract.id).filter(r => r.metal === rule.metal && r.type === 'prelim'); planMass = r1(yieldPlan - sum(prel, r => r1(yieldPlan * r.share / 100))); }
      DB.accruals.push({ id: nextNo('НЧ', 4), lotId: l.id, shipmentId: sh.id, assetId: sh.assetId, procId: sh.procId, metal: rule.metal, type: rule.type, seq: rule.seq, ruleId: rule.id, accountId: acc.id, planDate, planMass, calcMass: null, factDate: null, factMass: null, status: 'Планируется', comment: '' });
      if (rule.type === 'final') lotEnd = lotEnd ? maxDate(lotEnd, planDate) : planDate;
    });
    l.endPlan = lotEnd; shipEnd = shipEnd ? maxDate(shipEnd, lotEnd || shipEnd) : lotEnd;
  });
  sh.endPlan = shipEnd;
  logEvent('shipment', sh.id, `Отгрузка прибыла ${fmtD(dateIso)}; зафиксирован договор ${contract.no}; создано начислений: ${DB.accruals.filter(a => a.shipmentId === sh.id).length}`);
}

/* ---------- Начисления: исполнение (А31/А32/А33) и проведение (А8) ---------- */
function postAccrual(a) {
  const wanted = [];
  if (a.status === 'Исполнено' && a.factMass != null && a.factMass !== 0) {
    wanted.push({ accountId: a.accountId, qty: a.factMass, date: a.factDate, comment: (a.type === 'prelim' ? 'Предварительное' : 'Финальное') + ' начисление ' + a.metal + ' по лоту ' + a.lotId });
  }
  reconcileTxs('accrualId', a.id, wanted);
}
function executeAccrual(a, dateIso, opts = {}) {
  if (a.status !== 'Планируется') throw new Error('Начисление уже ' + a.status.toLowerCase());
  const l = lot(a.lotId);
  if (a.type === 'final' && !l.finalConfirmed) throw new Error('Финальное начисление исполняется только после подтверждения итоговых показателей лота (А33).');
  const today = DB.today;
  let d = dateIso || minDate(today, a.planDate);
  if (d > today) throw new Error('Фактическая дата начисления не может быть позже учётной даты (3.3.2).');
  a.factDate = d;
  a.factMass = a.type === 'prelim' ? a.planMass : a.calcMass;
  a.status = 'Исполнено';
  if (opts.doc) a.doc = opts.doc;
  postAccrual(a);
  completeLotIfDone(l);
  logEvent('accrual', a.id, `Исполнено ${fmtD(d)}: ${fmtKg(a.factMass)} ${a.metal} на ${accountName(account(a.accountId))}`);
}
function cancelAccrual(a, reason) {
  if (a.status !== 'Планируется') throw new Error('Отменить можно только начисление в статусе «Планируется».');
  a.status = 'Отменено'; a.comment = reason || a.comment; postAccrual(a); completeLotIfDone(lot(a.lotId));
}
function revertAccrual(a) { // администратор: возврат в «Планируется»

}
function autoExecuteAccruals() { // А31 — по расписанию: всё, что наступило
  let n = 0;
  DB.accruals.filter(a => a.status === 'Планируется' && a.planDate <= DB.today).forEach(a => {
    const l = lot(a.lotId);
    if (a.type === 'prelim' || l.finalConfirmed) { executeAccrual(a, a.planDate); n++; }
  });
  return n;
}
function dueAccruals() { return DB.accruals.filter(a => a.status === 'Планируется' && a.planDate <= DB.today && (a.type === 'prelim' || lot(a.lotId).finalConfirmed)); }
function setToday(dateIso) { // имитация хода времени в прототипе
  if (dateIso < DB.today) throw new Error('Учётную дату можно двигать только вперёд. «Сбросить данные» вернёт исходную.');
  DB.today = dateIso; DB.nowStamp = dateIso + 'T09:00';

}
function completeLotIfDone(l) { // А9
  const accs = DB.accruals.filter(a => a.lotId === l.id);
  if (!accs.length) return;
  const finals = accs.filter(a => a.type === 'final');
  const allFinalDone = finals.length && finals.every(a => a.status === 'Исполнено');
  const nonePlanned = accs.every(a => a.status !== 'Планируется');
  if (allFinalDone && nonePlanned && l.status !== 'Завершена переработка') {
    l.status = 'Завершена переработка';
    l.endFact = finals.map(a => a.factDate).sort().pop();
    const sh = shipment(l.shipmentId);
    const lots = DB.lots.filter(x => x.shipmentId === sh.id);
    if (lots.every(x => x.status === 'Завершена переработка')) { sh.status = 'Завершена переработка'; sh.endFact = lots.map(x => x.endFact).sort().pop(); }
  }
}

/* ---------- Подтверждение итоговых показателей (А33) / снятие (А34) ---------- */
function confirmFinal(l, source, dateIso, userId) {
  if (l.finalConfirmed) throw new Error('Итоговые показатели уже подтверждены.');
  if (l.status !== 'Прибыла') throw new Error('Подтверждение доступно для лота в статусе «Прибыла».');
  const cut = source === 'arb' ? 'arb' : source === 'our' ? 'our' : 'proc';
  if (!cutFilled(l, cut)) throw new Error('В выбранном разрезе заполнены не все показатели (химия и итоговый выход по каждому металлу). Подтверждение заблокировано.');
  METALS.forEach(m => {
    l[m + '_conc_final'] = l[m + '_conc_' + cut];
    l[m + '_mass_final'] = l[m + '_mass_' + cut];
    l[m + '_yield_final'] = cut === 'our' ? l[m + '_yield_plan'] : l[m + '_yield_' + cut];
  });
  l.finalSource = source; l.finalConfirmed = true; l.confirmedBy = userId || DB.currentUserId; l.confirmedAt = dateIso || DB.today;
  l.docs = (l.docs || []).concat(source === 'arb' ? [`Расчёт АЗ по сырью ${l.id}.pdf`, `Заключение арбитража ${l.id}.pdf`] : [`Расчёт АЗ по сырью ${l.id}.pdf`, `УПД за переработку ${l.id}.pdf`]);
  const condF = pickCondition(l.procContractId, chemOf(l, 'final'));
  l.condFinalId = condF ? condF.id : null;
  l.processingCost = condF ? r2(sum(METALS, m => (l[m + '_yield_final'] || 0) * condF[m + '_tariff'])) : null;
  const accs = DB.accruals.filter(a => a.lotId === l.id);
  METALS.forEach(m => {
    const fin = accs.find(a => a.metal === m && a.type === 'final');
    if (!fin) return;
    const prel = accs.filter(a => a.metal === m && a.type === 'prelim' && a.status !== 'Отменено');
    fin.calcMass = r1(l[m + '_yield_final'] - sum(prel, a => a.status === 'Исполнено' ? a.factMass : a.planMass));
    if (fin.status === 'Планируется' && fin.planDate <= DB.today) executeAccrual(fin, fin.planDate);
  });
  logEvent('lot', l.id, `Итоговые показатели подтверждены (источник: ${sourceName(source)})${condF ? ', условие ' + condF.name : ', условие не найдено'}`);
}
function unconfirmFinal(l) {
  const accs = DB.accruals.filter(a => a.lotId === l.id && a.type === 'final');
  if (accs.some(a => a.status === 'Исполнено')) throw new Error('Финальные начисления уже исполнены. Снять подтверждение может только администратор, предварительно вернув их в «Планируется».');
  METALS.forEach(m => { l[m + '_conc_final'] = null; l[m + '_mass_final'] = null; l[m + '_yield_final'] = null; });
  l.finalConfirmed = false; l.finalSource = null; l.confirmedBy = null; l.confirmedAt = null; l.condFinalId = null; l.processingCost = null;
  accs.forEach(a => a.calcMass = null);
  logEvent('lot', l.id, 'Подтверждение итоговых показателей снято');
}
function sourceName(s) { return { our: 'наша', proc: 'переработчика', arb: 'арбитраж' }[s] || '—'; }

/* ---------- Отгрузка: создание, отмена ---------- */
function createShipment(data) {
  if (data.sentFact && data.sentFact > DB.today) throw new Error('Фактическая дата отправки не может быть позже учётной даты.');
  if (data.fromLocId && locById(data.fromLocId).type === 'processor' && locById(data.fromLocId).ownerProc === data.procId) throw new Error('Переработчик и локация отправки совпадают.');
  const sh = { id: nextNo('ОТ', 3), status: 'Отправлена', procContractId: null, arrFact: null, endPlan: null, endFact: null, cancelReason: '', ...data };
  sh.groupId = asset(sh.assetId).groupId;
  DB.shipments.push(sh);

  return sh;
}
function addLot(sh, chem) {

  const n = DB.lots.filter(l => l.shipmentId === sh.id).length + 1;
  const l = { id: sh.id + '/' + n, shipmentId: sh.id, assetId: sh.assetId, groupId: sh.groupId, status: sh.status === 'Отмена отправки' ? 'Отмена отправки' : sh.status, outputProductId: sh.outputProductId, ligMass: chem.ligMass, procContractId: sh.procContractId, condPlanId: null, condFinalId: null, finalConfirmed: false, finalSource: null, arbitrationRequired: false, processingCost: null, endPlan: null, endFact: null, specOur: chem.specOur || `Спецификация ${sh.id}-${n}.pdf`, docs: [] };
  METALS.forEach(m => { l[m + '_conc_our'] = chem[m + '_conc']; l[m + '_mass_our'] = r1(chem[m + '_mass'] != null ? chem[m + '_mass'] : chem.ligMass * chem[m + '_conc'] / 100); ['proc', 'arb', 'final'].forEach(c => { l[m + '_conc_' + c] = null; l[m + '_mass_' + c] = null; l[m + '_yield_' + c] = null; }); l[m + '_yield_plan'] = null; });

  calcPlannedYield(l);
  DB.lots.push(l);
  postLot(l);
  return l;
}
function cancelShipment(sh, reason) {

  DB.lots.filter(l => l.shipmentId === sh.id).forEach(l => { l.status = 'Отмена отправки'; postLot(l); });
  accs.forEach(a => { a.status = 'Отменено'; postAccrual(a); });

function updateLotChem(l, chem, reason) { // процесс «Изменить» (А38) для нашей химии
  if (chem.ligMass != null) l.ligMass = chem.ligMass;
  METALS.forEach(m => { if (chem[m + '_conc'] != null) l[m + '_conc_our'] = chem[m + '_conc']; if (chem[m + '_mass'] != null) l[m + '_mass_our'] = chem[m + '_mass']; else if (chem[m + '_conc'] != null || chem.ligMass != null) l[m + '_mass_our'] = r1(l.ligMass * l[m + '_conc_our'] / 100); });
  if (l.status !== 'Прибыла' && l.status !== 'Завершена переработка') { const c = findProcContract(l.assetId, shipment(l.shipmentId).procId, shipment(l.shipmentId).productId, shipment(l.shipmentId).sentFact); if (c) { const cond = pickCondition(c.id, chemOf(l, 'our')); l.condPlanId = cond ? cond.id : null; } }

function setProcChem(l, cut, chem) {

  if (cut === 'proc') { l.specProc = l.specProc || `Спецификация приёмки ${l.id}.pdf`; checkArbitration(l); }

/* ---------- Сделки и контракты ---------- */
function dealMetal(c) { const d = deal(c.dealId); return d ? d.metal : null; }
function dealQuote(d) { return r2(d.exchangeQuote * (1 + d.discount / 100)); }
function contractCostUSD(c) { return r2(c.quote * c.mass / OZ); }
function contractCostCur(c) { return r2(contractCostUSD(c) * c.rate); }
function contractPayments(cid) { return DB.payments.filter(p => p.contractId === cid); }
function paymentCoveredUSD(p) { return p.status === 'Поступила' && p.factRub != null && p.payRate ? r2(p.factRub / p.payRate) : 0; }
function contractPaidUSD(c) { return r2(sum(contractPayments(c.id), paymentCoveredUSD)); }
function contractPaidRub(c) { return r2(sum(contractPayments(c.id).filter(p => p.status === 'Поступила'), p => p.factRub)); }
function contractRemainingUSD(c) { return r2(contractCostUSD(c) - contractPaidUSD(c)); }
function contractPayFlag(c) {
  if (c.status === 'Отменена') return '—';
  const paid = contractPaidUSD(c);
  if (contractRemainingUSD(c) <= DB.params.payTolerance) return 'полностью';
  return paid > 0 ? 'частично' : 'нет';
}
function contractShipFlag(c) { return c.receivedDate ? 'получено' : c.transferDate ? 'передано' : 'не передано'; }
function dealContracts(did, includeCancelled = false) { return DB.salesContracts.filter(c => c.dealId === did && (includeCancelled || c.status !== 'Отменена')); }
function dealAgg(d) {
  const cs = dealContracts(d.id);
  const mass = r1(sum(cs, c => c.mass));
  const costUSD = r2(sum(cs, contractCostUSD));
  const costCur = r2(sum(cs, contractCostCur));
  const paidUSD = r2(sum(cs, contractPaidUSD));
  const paidRub = r2(sum(cs, contractPaidRub));
  const remUSD = r2(costUSD - paidUSD);
  const payFlag = cs.length === 0 ? 'нет' : remUSD <= DB.params.payTolerance ? 'полностью' : paidUSD > 0 ? 'частично' : 'нет';
  const recv = cs.filter(c => c.receivedDate).length;
  const shipFlag = cs.length === 0 || recv === 0 ? 'нет' : recv === cs.length ? 'полностью' : 'частично';
  return { mass, costUSD, costCur, paidUSD, paidRub, remUSD, payFlag, shipFlag, pricePerG: mass ? r2(costCur / mass) : 0, n: cs.length };
}
function dealGroups(d) { const s = new Set(d.groupIds || []); dealContracts(d.id, true).forEach(c => s.add(asset(c.assetId).groupId)); return [...s]; }

function createDeal(data) {
  const d = { id: nextNo('СД', 3), status: 'Предварительная', currency: 'RUB', concludedDate: null, completedDate: null, cancelReason: '', groupIds: [], ...data };
  d.quote = dealQuote(d);
  const u = user(d.managerId); if (u && u.groupId) d.groupIds = [u.groupId];
  DB.deals.push(d);

}
function postSalesContract(c, opts = {}) { // А12

  const warnings = [];
  if (c.status !== 'Отменена') {
    if (!acc) throw new Error(`Счёт-источник ${assetName(c.assetId)} × ${locName(c.pickupLocId)} × ${d.metal} не существует — продавать нечего. Сохранение заблокировано (А12).`);
    const own = sum(DB.transactions.filter(t => t.contractId === c.id), t => t.qty); // собственное списание (отрицательное)
    const available = r1(acc.balance - own);
    if (c.mass > available) throw new Error(`Масса контракта ${fmtKg(c.mass)} больше остатка счёта ${accountName(acc)}: доступно ${fmtKg(available)}. Сделки заключаются только на металл, который уже есть на счёте — сохранение заблокировано (А12).`);

    if (loc.type === 'processor' && isRefinery(loc.ownerProc)) {
      const lim = activeLimit(c.assetId, d.metal);
      c.limitId = lim ? lim.id : null;
      if (!lim) warnings.push(`У ${assetName(c.assetId)} нет действующего лимита по ${d.metal}: ссылка на лимит пуста, операция попадёт в сверку.`);
      else { const own = DB.salesContracts.includes(c) ? 0 : c.mass; if (limitRemaining(lim) - own < 0) warnings.push(`Лимит ${lim.name} превышен: остаток после контракта ${fmtKg(r1(limitRemaining(lim) - own))}. Завод может не выдать металл; операция не блокируется (8.1.11).`); }
      const pc = DB.procContracts.filter(x => x.assetId === c.assetId && x.procId === loc.ownerProc && x.status === 'Действует' && x.dateFrom <= c.date && x.dateTo >= c.date && x.volumeAu != null);
      c.procContractId = pc.length ? pc[0].id : null;
      if (!pc.length) warnings.push(`Нет действующего договора переработки с ${procName(loc.ownerProc)} на дату контракта — объём договора не контролируется.`);
      else { const v = pc[0]['volume' + d.metal]; const used = contractVolumeUsed(pc[0].id, d.metal) + (DB.salesContracts.includes(c) ? 0 : c.mass); if (v != null && used > v) warnings.push(`Объём договора ${pc[0].no} по ${d.metal} превышен: израсходовано ${fmtKg(used)} из ${fmtKg(v)}.`); }
    } else { c.limitId = null; c.procContractId = null; }
    if (d.combinedBar) { // сборный слиток: все доли на одном АЗ, покупатель — банк
      const others = dealContracts(d.id).filter(x => x.id !== c.id);
      if (others.some(x => x.pickupLocId !== c.pickupLocId)) warnings.push('Сборный слиток: все доли должны быть на одном аффинажном заводе, а место забора контракта отличается.');
      if (client(d.clientId).type !== 'банк РФ') warnings.push('Сборный слиток: покупатель — только банк (завод не делает реестр для юрлица/экспорта).');
    }
  } else {
    reconcileTxs('contractId', c.id, []);
  }
  return warnings;
}
function createSalesContract(d, data) {
  if (d.status !== 'Предварительная' && d.status !== 'Заключена') throw new Error('Контракты добавляются в сделку в статусе «Предварительная» (А11).');
  const c = { id: nextNo('КП', 3), dealId: d.id, status: d.status === 'Заключена' ? 'Заключена' : 'Предварительная', quote: d.quote, exchangeQuote: d.exchangeQuote, discount: d.discount, rate: d.rate, pickupLocId: d.pickupLocId, carrierId: d.carrierId, logistics: d.logistics, consigneeId: d.consigneeId, payTerms: d.payTerms, transferDate: null, receivedDate: null, cancelReason: '', accountId: null, limitId: null, procContractId: null, ...data };
  c.groupId = asset(c.assetId).groupId;
  if (c.date > DB.today) throw new Error('Дата контракта не может быть позже учётной даты.');
  if (c.ligMass && c.fineness && !c.mass) c.mass = r1(c.ligMass * c.fineness / 100);
  if (c.ligMass && c.mass && !c.fineness) c.fineness = r2(c.mass / c.ligMass * 100);

  logEvent('contract', c.id, `Контракт создан: ${fmtKg(c.mass)} ${d.metal}, списано со счёта ${accountName(account(c.accountId))}` + (warnings.length ? '. Предупреждения: ' + warnings.join(' ') : ''));
  return { c, warnings };
}
function changeSalesContract(c, data, reason) { // процесс «Изменить» (А38) → перепроведение (А12)
  const before = clone(c);
  Object.assign(c, data);
  if (c.date > DB.today) { Object.assign(c, before); throw new Error('Дата контракта не может быть позже учётной даты.'); }
  try { const w = postSalesContract(c); logEvent('contract', c.id, `Изменено (${reason}): масса ${fmtKg(before.mass)} → ${fmtKg(c.mass)}, дата ${fmtD(before.date)} → ${fmtD(c.date)}; контракт перепроведён`); return w; }
  catch (e) { Object.assign(c, before); postSalesContract(c); throw e; }
}
function cancelSalesContract(c, reason, isAdmin) {
  if (c.transferDate && !isAdmin) throw new Error('Контракт после передачи металла отменяет только администратор (А16).');
  c.status = 'Отменена'; c.cancelReason = reason; postSalesContract(c);

}
function cancelDeal(d, reason, isAdmin) {

  cs.forEach(c => { c.status = 'Отменена'; c.cancelReason = reason + ' (отмена сделки)'; postSalesContract(c); });

}
function concludeDeal(d, dateIso) {

  if (!d.exchangeQuote || !d.rate) throw new Error('Для заключения нужны биржевая котировка, дисконт/премия и ориентировочный курс.');

}
function refreshDealStatus(d) { // А15
  if (['Предварительная', 'Отменена'].includes(d.status)) return;
  const cs = dealContracts(d.id);
  const agg = dealAgg(d);
  cs.forEach(c => {
    if (c.status === 'Отменена') return;
    const paidFull = contractPayFlag(c) === 'полностью';
    if (c.receivedDate && paidFull) c.status = 'Завершена';
    else if (c.transferDate || contractPaidUSD(c) > 0) c.status = 'Исполняется';
    else c.status = 'Заключена';
  });
  if (cs.length && agg.shipFlag === 'полностью' && agg.payFlag === 'полностью') { if (d.status !== 'Завершена') { d.status = 'Завершена'; d.completedDate = maxDate(cs.map(c => c.receivedDate).sort().pop(), DB.payments.filter(p => cs.some(c => c.id === p.contractId) && p.status === 'Поступила').map(p => p.factDate).sort().pop() || '0'); } }
  else if (cs.some(c => c.transferDate) || agg.paidUSD > 0) { d.status = 'Исполняется'; d.completedDate = null; }

}
function transferContract(c, dateIso) { // А28

  if (c.transferDate) throw new Error('Металл уже передан.');
  c.transferDate = dateIso;
  if (c.logistics === 'buyer') c.receivedDate = dateIso;
  refreshDealStatus(deal(c.dealId));
  logEvent('contract', c.id, `Передано спецперевозчику ${fmtD(dateIso)}` + (c.logistics === 'buyer' ? ' (логистика покупателя — считается получением)' : ''));
}
function receiveContract(c, dateIso) { // А35

  if (c.receivedDate) throw new Error('Получение уже отмечено.');
  if (dateIso < c.transferDate) throw new Error('Дата получения раньше даты передачи.');
  c.receivedDate = dateIso; refreshDealStatus(deal(c.dealId));
  logEvent('contract', c.id, 'Получение покупателем ' + fmtD(dateIso));
}
function addPayment(c, data) {
  const d = deal(c.dealId);
  const p = { id: nextNo('ПЛ', 4), contractId: c.id, dealId: c.dealId, assetId: c.assetId, groupId: c.groupId, status: 'Планируется', factRub: null, factDate: null, payRate: null, cancelReason: '', comment: '', ...data };

}
function receivePayment(p, factDate, factRub, rate) { // → А14
  if (p.status !== 'Планируется') throw new Error('Оплата уже ' + p.status.toLowerCase());
  if (!(factRub > 0) || !(rate > 0)) throw new Error('Нужны фактическая сумма в рублях и курс на дату оплаты.');
  if (factDate > DB.today) throw new Error('Дата оплаты не может быть позже учётной даты.');
  p.status = 'Поступила'; p.factDate = factDate; p.factRub = r2(factRub); p.payRate = r4(rate);
  refreshDealStatus(deal(p.dealId));
  logEvent('payment', p.id, `Поступила ${fmtD(factDate)}: ${fmtRub(p.factRub)} по курсу ${p.payRate} → покрыто ${fmtUsd(paymentCoveredUSD(p))}`);
}
function cancelPayment(p, reason) { p.status = 'Отменена'; p.cancelReason = reason; refreshDealStatus(deal(p.dealId)); }

/* ---------- Перемещения (А17) ---------- */
function postTransfer(t) {
  const warnings = [];
  const wanted = [];
  if (t.status === 'Проведено') {
    const from = locById(t.fromLocId), to = locById(t.toLocId);
    if (from.type === 'processor' && !isRefinery(from.ownerProc) && to.type === 'processor') throw new Error('Со счёта промежуточного переработчика на локацию переработчика металл перемещать нельзя: это отгрузка МПФ на следующий этап переработки (8.4.1). Сохранение заблокировано.');
    METALS.forEach(m => {
      const mass = t[m + '_mass'] || 0;
      if (mass <= 0) return;
      const src = findAccountByLoc(t.assetId, t.fromLocId, m);
      if (!src) throw new Error(`Счёт-источник ${assetName(t.assetId)} × ${locName(t.fromLocId)} × ${m} не существует. Сохранение заблокировано (А17).`);
      const own = sum(DB.transactions.filter(x => x.transferId === t.id && x.accountId === src.id), x => x.qty);
      const available = r1(src.balance - own);
      if (mass > available) throw new Error(`Масса ${fmtKg(mass)} ${m} больше остатка счёта ${accountName(src)} (доступно ${fmtKg(available)}). Сохранение заблокировано (А17).`);
      const dst = findOrCreateAccount(t.assetId, t.toLocId, m);
      wanted.push({ accountId: src.id, qty: -mass, date: t.date, comment: 'Перемещение ' + t.id + ' → ' + locName(t.toLocId) });
      wanted.push({ accountId: dst.id, qty: mass, date: t.date, comment: 'Перемещение ' + t.id + ' ← ' + locName(t.fromLocId) });
      if (from.type === 'processor' && isRefinery(from.ownerProc)) {
        const lim = activeLimit(t.assetId, m); t[m + '_limitId'] = lim ? lim.id : null;
        if (!lim) warnings.push(`Нет действующего лимита ${assetName(t.assetId)} по ${m}.`);
        const pc = DB.procContracts.find(x => x.assetId === t.assetId && x.procId === from.ownerProc && x.status === 'Действует' && x.dateFrom <= t.date && x.dateTo >= t.date);
        t[m + '_procContractId'] = pc ? pc.id : null;
      } else { t[m + '_limitId'] = null; t[m + '_procContractId'] = null; }
    });
  }
  reconcileTxs('transferId', t.id, wanted);
  if (t.status === 'Проведено') METALS.forEach(m => { const lim = t[m + '_limitId'] && limit(t[m + '_limitId']); const own = DB.transfers.includes(t) ? 0 : (t[m + '_mass'] || 0); if (lim && limitRemaining(lim) - own < 0) warnings.push(`Лимит ${lim.name} превышен: остаток после перемещения ${fmtKg(r1(limitRemaining(lim) - own))}. Операция не блокируется.`); });
  return warnings;
}
function createTransfer(data) {
  if (data.fromLocId === data.toLocId) throw new Error('Локации «Откуда» и «Куда» совпадают.');
  const t = { id: nextNo('ПМ', 3), status: 'Проведено', cancelReason: '', ...data };
  t.groupId = asset(t.assetId).groupId;
  if (t.date > DB.today) throw new Error('Дата перемещения не может быть позже учётной даты.');
  METALS.forEach(m => { if (t[m + '_mass'] == null && t.ligMass && t[m + '_fineness'] != null) t[m + '_mass'] = r1(t.ligMass * t[m + '_fineness'] / 100); t[m + '_mass'] = t[m + '_mass'] || 0; });
  if (!METALS.some(m => t[m + '_mass'] > 0)) throw new Error('Укажите массу хотя бы одного металла.');
  const warnings = postTransfer(t);
  DB.transfers.push(t);
  logEvent('transfer', t.id, `Проведено: ${METALS.filter(m => t[m + '_mass'] > 0).map(m => fmtKg(t[m + '_mass']) + ' ' + m).join(', ')} ${locName(t.fromLocId)} → ${locName(t.toLocId)}`);
  return { t, warnings };
}
function cancelTransfer(t, reason) {
  if (t.status !== 'Проведено') throw new Error('Перемещение уже отменено.');
  METALS.forEach(m => { const mass = t[m + '_mass'] || 0; if (mass <= 0) return; const dst = findAccountByLoc(t.assetId, t.toLocId, m); if (dst && dst.balance - mass < -0.05) throw new Error(`Отмена невозможна: со счёта ${accountName(dst)} уже списано ${fmtKg(mass - dst.balance)} из перемещённого металла (продажа или следующее перемещение). Сначала отмените те документы.`); });
  t.status = 'Отменено'; t.cancelReason = reason; postTransfer(t); logEvent('transfer', t.id, 'Отменено: ' + reason);
}
/* пересчёт плановых масс неисполненных начислений после изменения нашей химии (А38 → А5/А7) */
function replanAccruals(l) {
  const accs = DB.accruals.filter(a => a.lotId === l.id && a.status === 'Планируется');
  if (!accs.length || !l.procContractId) return;
  METALS.forEach(m => {
    const yieldPlan = l[m + '_yield_plan']; if (yieldPlan == null) return;
    const mine = accs.filter(a => a.metal === m); const prelAll = DB.accruals.filter(a => a.lotId === l.id && a.metal === m && a.type === 'prelim' && a.status !== 'Отменено');
    mine.forEach(a => { const rule = DB.rules.find(r => r.id === a.ruleId); if (!rule) return; if (a.type === 'prelim') a.planMass = r1(yieldPlan * rule.share / 100); });
    mine.filter(a => a.type === 'final').forEach(a => { if (l.finalConfirmed) return; a.planMass = r1(yieldPlan - sum(prelAll, p => p.status === 'Исполнено' ? p.factMass : p.planMass)); });
  });
  logEvent('lot', l.id, 'Плановые массы неисполненных начислений пересчитаны по новой химии');
}

function addCorrection(acc, qty, dateIso, comment) {

}
function addLimitAdjustment(l, qty, dateIso, comment) {

}
function createLimit(data) {
  if (data.status === 'Действует' && activeLimit(data.assetId, data.metal)) throw new Error('У актива по этому металлу уже есть действующий лимит — переведите прежний в «Архив» (А18).');
  const l = { id: nextNo('ЛМ', 3), status: 'Действует', doc: 'Лицензия.pdf', appId: null, ...data };
  l.groupId = asset(l.assetId).groupId;
  l.name = l.name || `${assetName(l.assetId)} · ${l.metal} · ${l.dateFrom.slice(0, 4)}`;
  DB.limits.push(l); return l;
}

/* ---------- Перепроведение (А36) ---------- */
function repostAll() {
  const before = DB.accounts.map(a => ({ id: a.id, bal: a.balance }));
  DB.lots.forEach(postLot);
  DB.accruals.forEach(postAccrual);
  DB.salesContracts.forEach(c => { try { postSalesContract(c); } catch (e) { /* остаток мог стать недостаточным — транзакция всё равно должна соответствовать документу */ reconcileTxs('contractId', c.id, c.status === 'Отменена' ? [] : [{ accountId: c.accountId, qty: -c.mass, date: c.date, comment: 'Контракт продажи ' + c.id }]); } });
  DB.transfers.forEach(t => { try { postTransfer(t); } catch (e) { } });
  recalcAllAccounts();
  return before.map(b => ({ id: b.id, before: b.bal, after: account(b.id).balance }));
}

function visibleGroups() { const u = user(DB.currentUserId); return u.companyLevel ? null : [u.groupId]; }
function canSee(groupIdOrIds) {
  const vg = visibleGroups(); if (!vg) return true;
  const ids = Array.isArray(groupIdOrIds) ? groupIdOrIds : [groupIdOrIds];
  return ids.some(g => vg.includes(g));
}

/* ---------- Форматирование ---------- */
function fmtNum(x, dec = 0) { if (x == null || isNaN(x)) return '—'; const s = Math.abs(x).toFixed(dec).replace('.', ','); const [i, f] = s.split(','); const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (x < 0 ? '−' : '') + ii + (f ? ',' + f : ''); }
function fmtKg(g) { if (g == null) return '—'; if (Math.abs(g) < 0.05) return '0,0 кг'; return fmtNum(g / 1000, 3) + ' кг'; }
function fmtG(g) { if (g == null) return '—'; return fmtNum(g, 1) + ' г'; }
function fmtUsd(x) { return x == null ? '—' : fmtNum(x, 2) + ' $'; }
function fmtRub(x) { return x == null ? '—' : fmtNum(x, 2) + ' ₽'; }
function fmtPct(x, dec = 2) { return x == null ? '—' : fmtNum(x, dec) + ' %'; }
function fmtD(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
function fmtDT(iso) { return iso ? fmtD(iso.slice(0, 10)) + ' ' + iso.slice(11, 16) : '—'; }

/* ============================================================
   Редактирование, «Изменить» с причиной, удаление, справочники
   ============================================================ */
function editShipment(sh, data) { // некритичные поля — без причины
  Object.assign(sh, data);
  logEvent('shipment', sh.id, 'Отредактированы поля: ' + Object.keys(data).join(', '));
}
function changeShipment(sh, data, reason) { // ключевые поля (А38) → перепроведение лотов (А4)
  const before = clone(sh);
  Object.assign(sh, data);
  if (sh.sentFact > DB.today) { Object.assign(sh, before); throw new Error('Фактическая дата отправки не может быть позже учётной даты.'); }
  sh.groupId = asset(sh.assetId).groupId;
  const keyChanged = ['assetId', 'procId', 'productId'].some(k => before[k] !== sh[k]);
  let contract = null;
  if (sh.procContractId && keyChanged) {           // отгрузка уже прибыла — нужен договор под новый ключ
    contract = findProcContract(sh.assetId, sh.procId, sh.productId, sh.arrFact || DB.today);
    if (!contract) { Object.assign(sh, before); throw new Error(`Нет действующего договора переработки ${assetName(sh.assetId)} × ${procName(data.procId || sh.procId)} × ${productType(data.productId || sh.productId).name} на ${fmtD(sh.arrFact || DB.today)} — изменение отклонено.`); }
    if (DB.accruals.some(a => a.shipmentId === sh.id && a.status === 'Исполнено' && lot(a.lotId).finalConfirmed)) { Object.assign(sh, before); throw new Error('По лотам отгрузки подтверждены итоги и исполнены финальные начисления — сначала снимите подтверждение (администратор).'); }
    sh.procContractId = contract.id; sh.outputProductId = processor(sh.procId).outputProductId;
  }
  DB.lots.filter(l => l.shipmentId === sh.id).forEach(l => {
    l.assetId = sh.assetId; l.groupId = sh.groupId; l.outputProductId = sh.outputProductId;
    if (contract) { l.procContractId = contract.id; const cond = pickCondition(contract.id, chemOf(l, 'our')); l.condPlanId = cond ? cond.id : null; calcPlannedYield(l); }
    postLot(l);
  });
  const moved = {};                                 // старый счёт → новый, для ленты счетов
  DB.accruals.filter(a => a.shipmentId === sh.id).forEach(a => {
    a.assetId = sh.assetId; a.procId = sh.procId;
    if (keyChanged && sh.procContractId) { const acc = findOrCreateAccount(sh.assetId, locOfProcessor(sh.procId).id, a.metal); if (acc.id !== a.accountId) { const from = a.accountId; a.accountId = acc.id; (moved[from + '|' + acc.id] = moved[from + '|' + acc.id] || []).push(a); logEvent('accrual', a.id, `Перенацелено со счёта ${accountName(account(from))} на ${accountName(acc)} по изменению отгрузки ${sh.id}: ${reason}`); } postAccrual(a); }
  });
  if (contract) DB.lots.filter(l => l.shipmentId === sh.id).forEach(replanAccruals);
  recalcAllAccounts();
  const LBL = { assetId: ['Актив', assetName], procId: ['Переработчик', procName], productId: ['Тип продукции', v => productType(v).name], fromLocId: ['Откуда', locName], sentFact: ['Дата отправки (факт)', fmtD] };
  const diff = Object.keys(LBL).filter(k => before[k] !== sh[k]).map(k => `${LBL[k][0]}: ${LBL[k][1](before[k])} → ${LBL[k][1](sh[k])}`).join('; ');
  logEvent('shipment', sh.id, `Изменены ключевые поля — ${diff || 'без изменений'}. Причина: ${reason}. Лоты и начисления перепроведены` + (contract ? `, договор переработки теперь ${contract.no}` : ''));
  Object.keys(moved).forEach(k => { const [from, to] = k.split('|'); const list = moved[k]; const done = list.filter(a => a.status === 'Исполнено'); const txt = `${list.length} начислений по отгрузке ${sh.id}` + (done.length ? ` (исполнено ${done.length}: ${METALS.map(m => { const q = sum(done.filter(a => a.metal === m), a => a.factMass); return q ? fmtKg(q) + ' ' + m : null; }).filter(Boolean).join(', ')})` : ''); logEvent('account', from, `Снято: ${txt} перенесены на счёт ${accountName(account(to))} — изменение отгрузки: ${reason}`); logEvent('account', to, `Получено: ${txt} перенесены со счёта ${accountName(account(from))} — изменение отгрузки: ${reason}`); });
  DB.lots.filter(l => l.shipmentId === sh.id).forEach(l => logEvent('lot', l.id, `Перепроведён по изменению отгрузки ${sh.id}: ${diff}. Причина: ${reason}`));
}

/* ---------- договоры переработки ---------- */
function checkContractRules(cid) { // А26
  const rules = contractRules(cid), conds = contractConditions(cid), errs = [];
  const metals = productType(procContract(cid).productId).metals;
  metals.forEach(m => {
    const fin = rules.filter(r => r.metal === m && r.type === 'final'), pre = rules.filter(r => r.metal === m && r.type === 'prelim');
    if (fin.length !== 1) errs.push(`${m}: должно быть ровно одно финальное правило (сейчас ${fin.length})`);
    if (sum(pre, r => r.share) >= 100) errs.push(`${m}: сумма долей предварительных правил ${sum(pre, r => r.share)} % — должна быть меньше 100 %`);
    if (fin.length && pre.some(r => r.days > fin[0].days)) errs.push(`${m}: срок финального начисления меньше срока предварительного`);
  });
  for (let i = 0; i < conds.length; i++) for (let j = i + 1; j < conds.length; j++) { const a = conds[i], b = conds[j]; const ov = METALS.every(m => a[m + '_from'] <= b[m + '_to'] && b[m + '_from'] <= a[m + '_to']); if (ov) errs.push(`Условия «${a.name}» и «${b.name}» пересекаются по диапазонам`); }
  if (!conds.length) errs.push('Нет ни одного условия переработки');
  return errs;
}
function createProcContract(data) {
  const c = { id: nextNo('ДП', 3), status: 'Проект', comment: '', file: 'Договор переработки.pdf', volumeAu: null, volumeAg: null, ...data };
  c.groupId = asset(c.assetId).groupId;
  DB.procContracts.push(c); return c;
}
function activateProcContract(c) { // А25 + А26
  const errs = checkContractRules(c.id);
  if (!c.dateFrom || !c.dateTo) errs.push('Не заполнены даты начала и окончания');
  const clash = DB.procContracts.find(x => x.id !== c.id && x.status === 'Действует' && x.assetId === c.assetId && x.procId === c.procId && x.productId === c.productId && x.dateFrom <= c.dateTo && c.dateFrom <= x.dateTo);
  if (clash) errs.push(`Период пересекается с действующим договором ${clash.no} (А25)`);
  if (errs.length) throw new Error('Переход в «Действует» заблокирован: ' + errs.join('; '));
  c.status = 'Действует';
}
function addCondition(c, data) {
  const cond = { id: nextNo('УП', 3), contractId: c.id, order: contractConditions(c.id).length + 1, ...data };
  const clash = contractConditions(c.id).find(x => METALS.every(m => x[m + '_from'] <= cond[m + '_to'] && cond[m + '_from'] <= x[m + '_to']));
  if (clash) throw new Error(`Диапазон пересекается с условием «${clash.name}» (А26). Новое условие допустимо только на ранее не охваченный диапазон.`);
  DB.conditions.push(cond); return cond;
}
function addRule(c, data) {
  if (c.status === 'Действует') throw new Error('В действующем договоре правила начисления не меняются: изменение — новый договор (5.5).');
  const r = { id: nextNo('ПН', 3), contractId: c.id, ...data }; DB.rules.push(r); return r;
}
function deleteCondition(cond) { if (DB.lots.some(l => l.condPlanId === cond.id || l.condFinalId === cond.id)) throw new Error('На условие ссылаются лоты — удалить нельзя.'); DB.conditions = DB.conditions.filter(x => x.id !== cond.id); }
function deleteRule(r) { if (DB.accruals.some(a => a.ruleId === r.id)) throw new Error('На правило ссылаются начисления — удалить нельзя.'); DB.rules = DB.rules.filter(x => x.id !== r.id); }

/* ---------- удаление (только администратор, только отменённые документы — 3.3.7) ---------- */
function deleteDocument(kind, id) {
  if (!isAdmin()) throw new Error('Удаляет только администратор (3.3.7).');
  const mustBe = (st, ok) => { if (!ok.includes(st)) throw new Error(`Удалить можно только отменённую запись (сейчас «${st}»). Вместо удаления используется отмена.`); };
  switch (kind) {
    case 'shipment': { const sh = shipment(id); mustBe(sh.status, ['Отмена отправки']); DB.accruals = DB.accruals.filter(a => a.shipmentId !== id); DB.lots = DB.lots.filter(l => l.shipmentId !== id); DB.transactions = DB.transactions.filter(t => !t.lotId || !t.lotId.startsWith(id + '/')); DB.shipments = DB.shipments.filter(s => s.id !== id); break; }
    case 'deal': { const d = deal(id); mustBe(d.status, ['Отменена']); const cs = dealContracts(id, true).map(c => c.id); DB.payments = DB.payments.filter(p => p.dealId !== id); DB.transactions = DB.transactions.filter(t => !cs.includes(t.contractId)); DB.salesContracts = DB.salesContracts.filter(c => c.dealId !== id); DB.deals = DB.deals.filter(x => x.id !== id); break; }
    case 'contract': { const c = salesContract(id); mustBe(c.status, ['Отменена']); DB.payments = DB.payments.filter(p => p.contractId !== id); DB.transactions = DB.transactions.filter(t => t.contractId !== id); DB.salesContracts = DB.salesContracts.filter(x => x.id !== id); break; }
    case 'transfer': { const t = transfer(id); mustBe(t.status, ['Отменено']); DB.transactions = DB.transactions.filter(x => x.transferId !== id); DB.transfers = DB.transfers.filter(x => x.id !== id); break; }
    case 'accrual': { const a = accrual(id); mustBe(a.status, ['Отменено']); DB.accruals = DB.accruals.filter(x => x.id !== id); break; }
    case 'payment': { const p = payment(id); mustBe(p.status, ['Планируется', 'Отменена']); DB.payments = DB.payments.filter(x => x.id !== id); refreshDealStatus(deal(p.dealId)); break; }
    case 'adjustment': { DB.limitAdjustments = DB.limitAdjustments.filter(x => x.id !== id); break; }
    case 'correction': { const t = DB.transactions.find(x => x.id === id); if (!t || t.type !== 'Корректировка') throw new Error('Вручную удаляется только корректировка.'); DB.transactions = DB.transactions.filter(x => x.id !== id); recalcAccount(t.accountId); break; }
    case 'procContract': { const c = procContract(id); mustBe(c.status, ['Проект']); if (DB.lots.some(l => l.procContractId === id)) throw new Error('На договор ссылаются лоты.'); DB.conditions = DB.conditions.filter(x => x.contractId !== id); DB.rules = DB.rules.filter(x => x.contractId !== id); DB.procContracts = DB.procContracts.filter(x => x.id !== id); break; }
  }
  DB.events.push({ ts: DB.nowStamp, date: DB.today, kind: 'system', id, text: `Удалена запись ${id} (${kind})`, user: DB.currentUserId });
}

/* ---------- Цепочка переработки (этапы) ---------- */
function shipmentStage(sh) {
  const from = locById(sh.fromLocId); const fromProc = from && from.type === 'processor';
  if (fromProc) return { code: 'stage2', label: 'Этап 2: от промежуточного переработчика на аффинаж', short: 'этап 2' };
  if (isRefinery(sh.procId)) return { code: 'direct', label: 'Прямая: с актива сразу на аффинажный завод', short: 'прямая' };
  return { code: 'stage1', label: 'Этап 1: с актива к промежуточному переработчику', short: 'этап 1' };
}
/* связанные отгрузки той же цепочки: для этапа 1 — отгрузки с локации этого переработчика по тому же активу; для этапа 2 — отгрузки на этого переработчика */
function chainShipments(sh) {
  const st = shipmentStage(sh).code;
  if (st === 'stage1') { const loc = locOfProcessor(sh.procId); return DB.shipments.filter(x => x.id !== sh.id && x.assetId === sh.assetId && x.fromLocId === loc.id && x.status !== 'Отмена отправки'); }
  if (st === 'stage2') { const from = locById(sh.fromLocId); return DB.shipments.filter(x => x.id !== sh.id && x.assetId === sh.assetId && x.procId === from.ownerProc && x.status !== 'Отмена отправки'); }
  return [];
}

/* openForm: универсальная форма с живым пересчётом

function openForm(cfg) {

    const id = 'f_' + f.name;

    if (f.type === 'select') ctl = `<select ${common}>${(f.options || []).map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(f.value) ? 'selected' : ''} ${o.disabled ? 'disabled' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea ${common}>${esc(f.value || '')}</textarea>`;

    return `<div class="fld ${f.full ? 'full' : ''}"><label>${f.label}${f.required ? ' <span class="req">*</span>' : ''}</label>${ctl}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
  }).join('');

/* ---------- простые SVG-диаграммы ---------- */
function barChart(data, opts = {}) { // data: [{label, value, color}] или series: opts.series = [{name,color,values:[]}] с data как labels
  const W = opts.width || 600, H = opts.height || 200, padL = 58, padB = 30, padT = 12, padR = 10;
  const series = opts.series || [{ values: data.map(d => d.value), colors: data.map(d => d.color || '#2f6fed') }];
  const labels = opts.series ? data : data.map(d => d.label);
  const max = Math.max(...series.flatMap(sr => sr.values.map(v => Math.abs(v))), 1e-9);
  const n = labels.length, bw = (W - padL - padR) / Math.max(n, 1), gw = bw * 0.72 / series.length;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const ticks = 4;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  for (let i = 0; i <= ticks; i++) { const v = max * i / ticks; s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7ee"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${opts.fmt ? opts.fmt(v) : fmtNum(v)}</text>`; }
  labels.forEach((lab, i) => {
    series.forEach((sr, k) => { const v = sr.values[i] || 0; const x = padL + i * bw + bw * 0.14 + k * gw, yy = y(Math.max(v, 0)), hh = Math.abs(y(0) - y(Math.abs(v))); s += `<rect x="${x}" y="${yy}" width="${gw - 2}" height="${hh}" rx="2" fill="${sr.color || (sr.colors && sr.colors[i]) || '#2f6fed'}"><title>${esc(lab)}${sr.name ? ' · ' + esc(sr.name) : ''}: ${opts.fmt ? opts.fmt(v) : fmtNum(v)}</title></rect>`; });
    const short = String(lab).length > 11 ? String(lab).slice(0, 10) + '…' : lab;
    s += `<text x="${padL + i * bw + bw / 2}" y="${H - 10}" text-anchor="middle">${esc(short)}</text>`;
  });
  return s + '</svg>';
}
function hBars(data, opts = {}) { // data: [{label, value, max, text}]
  return `<div>${data.map(d => { const p = d.max ? Math.min(100, Math.round(d.value / d.max * 100)) : 0; const col = p >= 90 ? 'red' : p >= 80 ? 'amber' : ''; return `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${d.label}</span><span class="muted">${d.text || ''}</span></div><div class="bar"><i class="${col}" style="width:${p}%"></i></div></div>`; }).join('')}</div>`;
}

/* порядок по умолчанию для плановых списков: открытые — ближайшие сверху, исполненные/отменённые — внизу (свежие выше) */
function planOrder(doneStatuses) {
  const done = r => doneStatuses.includes(r.status) ? 1 : 0;
  return (a, b) => done(a) - done(b) || (done(a) ? String(b.planDate).localeCompare(String(a.planDate)) : String(a.planDate).localeCompare(String(b.planDate)));
}

    fields: [
      { name: 'assetId', label: 'Актив (собственник)', type: 'select', options: assets.map(a => ({ value: a.id, label: a.name })), required: true },
      { name: 'fromLocId', label: 'Откуда', type: 'select', options: [...DB.locations.filter(l => l.type === 'asset').map(l => ({ value: l.id, label: l.name + ' — площадка актива' })), ...DB.locations.filter(l => l.type === 'processor' && !isRefinery(l.ownerProc)).map(l => ({ value: l.id, label: l.name + ' — промежуточный переработчик (этап 2)' }))], required: true, hint: 'с площадки актива — этап 1 или прямая отгрузка на аффинаж; с локации промежуточного переработчика — этап 2 (металл спишется с его счёта)' },

      { name: 'productId', label: 'Тип продукции', type: 'select', options: DB.productTypes.filter(p => p.stage === 'полуфабрикат').map(p => ({ value: p.id, label: p.name })), value: 'PT-DORE', required: true },
      { name: 'carrierId', label: 'Перевозчик', type: 'select', options: DB.carriers.map(c => ({ value: c.id, label: c.name + (c.kind === 'regular' ? ' (обычный, только концентрат)' : ' (спецперевозчик)') })), required: true },
      { name: 'method', label: 'Способ доставки', type: 'select', options: opt(['Автотранспорт', 'Авиа', 'ЖД']), required: true },
      { name: 'sentPlan', label: 'Дата отправки: план', type: 'date', value: DB.today, required: true },
      { name: 'sentFact', label: 'Дата отправки: факт', type: 'date', value: DB.today, required: true, max: DB.today },
      { name: 'uin', label: 'УИН/ИНП партии (ГИИС ДМДК)', type: 'text', placeholder: 'присваивает ГИИС при регистрации партии' },
      { name: 'seals', label: 'Номера пломб СБ/ОТК', type: 'text', placeholder: 'например, СБ-1021…1026' },
    ],
    live: v => {
      const term = DB.deliveryTerms.find(t => t.fromLocId === v.fromLocId && t.toLocId === locOfProcessor(v.procId).id && t.method === v.method);
      const c = findProcContract(v.assetId, v.procId, v.productId, v.sentFact);
      const from = locById(v.fromLocId);
      const stg = shipmentStage({ fromLocId: v.fromLocId, procId: v.procId }); const fromProc = from && from.type === 'processor' ? processor(from.ownerProc) : null;
      const wrongProduct = fromProc && v.productId !== fromProc.outputProductId; const toInter = fromProc && !isRefinery(v.procId);
      const interBal = fromProc ? METALS.map(m => { const a = findAccountByLoc(v.assetId, v.fromLocId, m); return `${m} ${fmtKg(a ? a.balance : 0)}`; }).join(' · ') : '';
      const routeRow = `<div class="lr"><span>Схема переработки</span><b>${esc(stg.label)}</b></div>` + (wrongProduct ? `<div class="lr"><span>Тип продукции</span><b class="neg">с ${esc(from.name)} уходит ${esc(productType(fromProc.outputProductId).name)} — выберите его</b></div>` : '') + (toInter ? `<div class="lr"><span>Переработчик</span><b class="warn">этап 2 обычно идёт на аффинажный завод; промежуточный → промежуточный допустим, но проверьте договор</b></div>` : '') + (fromProc ? `<div class="lr"><span>Остаток ${esc(assetName(v.assetId))} на ${esc(from.name)}</span><b>${interBal}</b></div>` : '');

function formArrive(sh) {

      }).join('')}</div>`;
      return out;
    },
    submit: v => { if (v.date > DB.today) throw new Error('Дата прибытия не может быть позже учётной даты.'); if (v.date < sh.sentFact) throw new Error('Дата прибытия раньше даты отправки.'); arriveShipment(sh, v.date); autoExecuteAccruals(); toast('Отгрузка прибыла, начисления созданы', 'ok'); },

  if (t.lotId) return 'Лот ' + refLink('lot', t.lotId);

  if (t.contractId) return 'Контракт ' + refLink('contract', t.contractId);
  if (t.transferId) return 'Перемещение ' + refLink('transfer', t.transferId);
  return '<span class="badge violet">корректировка</span>';
}
function txTable(txs, opts = {}) {
  return table({ id: opts.id || 'tx', compact: true, rows: txs, totals: true, defaultSort: { key: 'date', dir: 'desc' }, cols: [
    { key: 'id', label: 'Номер', val: r => r.id }, ...(opts.withAccount ? [{ key: 'acc', label: 'УМС', render: r => refLink('account', r.accountId, accountName(account(r.accountId))), sortVal: r => accountName(account(r.accountId)) }] : []),
    { key: 'date', label: 'Дата транзакции', val: r => fmtD(r.date), sortVal: r => r.date }, { key: 'type', label: 'Тип', render: r => `<span class="badge ${r.type === 'Начисление' ? 'green' : r.type === 'Списание' ? 'red' : 'violet'}">${r.type}</span>`, sortVal: r => r.type },

    { key: 'basis', label: 'Основание', render: txBasis }, { key: 'comment', label: 'Комментарий', val: r => r.comment }, { key: 'created', label: 'Создана', val: r => fmtDT(r.createdAt), sortVal: r => r.createdAt }, { key: 'author', label: 'Автор', val: r => user(r.author) ? user(r.author).name : '—' },
    ...(opts.corrDelete && isAdmin() ? [{ key: 'act', label: '', sortable: false, render: r => r.type === 'Корректировка' ? rowActs([{ label: 'Удалить', act: 'deleteCorr', id: r.id, danger: true }]) : '<span class="muted small" title="Транзакции с основанием вручную не удаляются (8.3.6)">—</span>' }] : []),
